<!doctype html><!--wrap-->
<html lang="es"><!--wrap-->
<head><!--wrap-->
<meta charset="utf-8"><!--wrap-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--wrap-->
<title>Farmacia Carlos Casado Buigues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">
<style>
/* Layout: cabecera en azul petróleo de la marca con el anagrama Cb y quién está trabajando ahora;
   debajo, pestañas y cuadrícula de días que se apila en móvil. Motivo de marca: cuadrado + línea turquesa. */
:root {
  --bg: #edf2f4;
  --surface: #ffffff;
  --surface-2: #f4f7f8;
  --fg: #17303b;
  --muted: #5d747e;
  --line: #d6e0e4;
  --brand: #154f69;
  --brand-2: #496574;
  --sage: #87a4ad;
  --accent: #50c4ca;
  --accent-ink: #0e7a82;
  --accent-soft: #daf2f3;
  --on-brand: #ffffff;
  --on-brand-muted: rgb(255 255 255 / 0.72);
  --brand-glass: rgb(255 255 255 / 0.08);
  --brand-line: rgb(255 255 255 / 0.18);
  --r-tit: #5b47a0;   --r-tit-soft: #ece8f7;
  --r-adj: #154f69;   --r-adj-soft: #dbe8ee;
  --r-tec: #0e7a82;   --r-tec-soft: #daf2f3;
  --r-aux: #496574;   --r-aux-soft: #e3eaed;
  --r-est: #a3600a;   --r-est-soft: #fbecd4;
  --sh-m: #f3f8f9;
  --sh-t: #eef3f6;
  --ok: #17794a;      --ok-soft: #dbf1e5;
  --warn: #965600;    --warn-soft: #fbedd5;
  --err: #b3261e;     --err-soft: #f9dfdc;
  --shadow: 0 1px 2px rgb(21 79 105 / 0.06), 0 8px 24px rgb(21 79 105 / 0.06);
  --f-display: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-body: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a161c; --surface: #102029; --surface-2: #142832; --fg: #dbe8ec; --muted: #8ea6b0; --line: #22404c;
    --brand: #0d3447; --brand-2: #1a4558; --sage: #6c8a94; --accent: #5fd0d6; --accent-ink: #72d9de; --accent-soft: #12363f;
    --r-tit: #b9a6ee; --r-tit-soft: #2a2446; --r-adj: #8cc3dc; --r-adj-soft: #15344a;
    --r-tec: #72d9de; --r-tec-soft: #12363f; --r-aux: #a9bfc8; --r-aux-soft: #1c303a; --r-est: #e9ad57; --r-est-soft: #3a2a12;
    --sh-m: #12262f; --sh-t: #132330;
    --ok: #5fd39a; --ok-soft: #143826; --warn: #e9ad57; --warn-soft: #3a2a12; --err: #f28b82; --err-soft: #43201d;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a161c; --surface: #102029; --surface-2: #142832; --fg: #dbe8ec; --muted: #8ea6b0; --line: #22404c;
  --brand: #0d3447; --brand-2: #1a4558; --sage: #6c8a94; --accent: #5fd0d6; --accent-ink: #72d9de; --accent-soft: #12363f;
  --r-tit: #b9a6ee; --r-tit-soft: #2a2446; --r-adj: #8cc3dc; --r-adj-soft: #15344a;
  --r-tec: #72d9de; --r-tec-soft: #12363f; --r-aux: #a9bfc8; --r-aux-soft: #1c303a; --r-est: #e9ad57; --r-est-soft: #3a2a12;
  --sh-m: #12262f; --sh-t: #132330;
  --ok: #5fd39a; --ok-soft: #143826; --warn: #e9ad57; --warn-soft: #3a2a12; --err: #f28b82; --err-soft: #43201d;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.35rem, 3vw, 1.9rem); font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; }
h2 { font-size: 1.2rem; font-weight: 700; display: inline-flex; flex-direction: column; gap: 4px; }
h2::after { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--accent); }
h3 { font-size: 1rem; font-weight: 700; }
.mono { font-variant-numeric: tabular-nums; font-size: 0.9em; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabecera */
.hero { background: var(--brand); color: var(--on-brand); position: relative; overflow: hidden; }
.hero::before, .hero::after { content: ""; position: absolute; border: 22px solid rgb(255 255 255 / 0.04); pointer-events: none; }
.hero::before { width: 360px; height: 360px; right: -90px; top: -120px; }
.hero::after { width: 180px; height: 180px; right: 220px; bottom: -110px; border-width: 12px; border-color: rgb(80 196 202 / 0.10); }
.hero .wrap { padding-block: 20px 24px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { width: 58px; height: 58px; flex: none; color: var(--on-brand); }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--on-brand-muted); font-size: 0.92rem; }

.tabs { display: grid; grid-template-columns: repeat(4, auto); gap: 2px; background: var(--brand-glass); border: 1px solid var(--brand-line); padding: 3px; border-radius: 6px; }
.tabs button { border: 0; background: transparent; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-weight: 600; color: var(--on-brand-muted); letter-spacing: 0.02em; }
.tabs button:hover { color: var(--on-brand); }
.tabs button[aria-selected="true"] { background: var(--on-brand); color: var(--brand); }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--accent); color: #062126; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-selected="true"] { background: var(--accent); color: #062126; } }
@media (max-width: 560px) { .tabs { width: 100%; grid-template-columns: repeat(4, 1fr); } .tabs button { padding-inline: 4px; } }

/* Ahora */
.now { background: var(--brand-glass); border: 1px solid var(--brand-line); border-radius: var(--radius); padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px 24px; align-items: center; }
.now .label { font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-brand-muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgb(80 196 202 / 0.25); }
@media (prefers-reduced-motion: no-preference) { .live { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgb(80 196 202 / 0.05); } } }
.now .state { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.now .state .mono { white-space: nowrap; color: var(--on-brand-muted); font-weight: 400; }
.now .people { display: flex; flex-wrap: wrap; gap: 10px; }
.now .soft { color: var(--on-brand-muted); }
.who { display: inline-flex; align-items: center; gap: 10px; padding: 5px 16px 5px 5px; border-radius: 8px; background: var(--brand-glass); border: 1px solid var(--brand-line); }
.who .av { width: 42px; height: 42px; }
.who-t { display: flex; flex-direction: column; line-height: 1.15; }
.who-t strong { font-size: 1rem; font-weight: 600; }
.who-t small { color: var(--on-brand-muted); font-size: 0.82rem; }
@media (max-width: 640px) { .now { grid-template-columns: 1fr; } }

/* Roles y avatares */
.role-titular { --c: var(--r-tit); --cs: var(--r-tit-soft); }
.role-adjunto { --c: var(--r-adj); --cs: var(--r-adj-soft); }
.role-tecnico { --c: var(--r-tec); --cs: var(--r-tec-soft); }
.role-auxiliar { --c: var(--r-aux); --cs: var(--r-aux-soft); }
.role-estudiante { --c: var(--r-est); --cs: var(--r-est-soft); }
.av { width: 34px; height: 34px; border-radius: 30%; overflow: hidden; flex: none; display: inline-block; background: var(--sage); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.av svg { width: 100%; height: 100%; display: block; }
.who .av { box-shadow: 0 0 0 2px var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); }
.badge { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 8px; border-radius: 4px; background: var(--cs); color: var(--c); white-space: nowrap; }
.badge.lead { background: var(--accent-soft); color: var(--accent-ink); }

/* Contenido */
.app { padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.btn:hover { border-color: var(--brand-2); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.danger { color: var(--err); }
.btn.danger:hover { border-color: var(--err); }
.btn.danger.solid { background: var(--err); color: var(--surface); border-color: var(--err); }
.btn.sm { padding: 4px 12px; font-size: 0.88rem; }
.btn.round { width: 38px; height: 38px; padding: 0; font-size: 1.2rem; line-height: 1; }
.iconbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 26px; height: 26px; border-radius: 5px; font-size: 1.1rem; line-height: 1; }
.iconbtn:hover { background: var(--err-soft); color: var(--err); }

.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.weeknav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weeknav .range { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; min-width: 12ch; text-align: center; color: var(--brand); }
:root[data-theme="dark"] .weeknav .range { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .weeknav .range { color: var(--fg); } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Cuadrícula semanal */
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.day > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }
.day .dname { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--brand); }
:root[data-theme="dark"] .day .dname { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .day .dname { color: var(--fg); } }
.day .ddate { color: var(--muted); font-size: 0.95rem; margin-left: 6px; }
.day .todaytag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #062126; background: var(--accent); padding: 1px 9px; border-radius: 4px; }
.day.closed { background: var(--surface-2); box-shadow: none; }
.closedmsg { padding: 2px 16px 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
.shift { margin: 0 8px 8px; padding: 10px 10px 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
.shift.sh-M { background: var(--sh-m); }
.shift.sh-T { background: var(--sh-t); }
.shift-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.shift-h strong { font-family: var(--f-display); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand-2); }
:root[data-theme="dark"] .shift-h strong { color: var(--sage); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shift-h strong { color: var(--sage); } }
.shift-h .mono { color: var(--muted); margin-left: 8px; }
.shift ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pp .av { width: 38px; height: 38px; }
.pp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 9px; padding: 5px 4px 5px 5px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.pp .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.pp .nm .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 0.98rem; }
.pp .nm .r { font-size: 0.76rem; color: var(--c); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp.gone { opacity: 0.55; }
.pp.gone .n { text-decoration: line-through; }
select.resp { border: 0; border-radius: 4px; padding: 3px 6px; font-size: 0.82rem; font-weight: 600; width: 108px; cursor: pointer; background: var(--accent-soft); color: var(--accent-ink); }
select.resp[data-resp="admin"] { background: var(--r-aux-soft); color: var(--r-aux); }
select.resp[data-resp="gestion"] { background: var(--r-tit-soft); color: var(--r-tit); }
select.resp[data-resp="practicas"] { background: var(--r-est-soft); color: var(--r-est); }
select.add { border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 5px 10px; font-size: 0.9rem; color: var(--muted); width: 100%; cursor: pointer; }
select.add:hover { border-color: var(--accent); color: var(--accent-ink); }
.issues { display: flex; flex-wrap: wrap; gap: 4px; }
.issue { font-size: 0.8rem; font-weight: 600; padding: 1px 9px; border-radius: 4px; }
.issue.err { background: var(--err-soft); color: var(--err); }
.issue.warn { background: var(--warn-soft); color: var(--warn); }
.issue.info { background: var(--surface); color: var(--muted); }

/* Paneles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
th { text-align: left; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td .rowact { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.person { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.person .av { width: 38px; height: 38px; }
.pcap { display: flex; flex-direction: column; line-height: 1.15; }
.pcap small { font-weight: 400; font-size: 0.8rem; color: var(--muted); }

form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.field input, .field select, .field textarea, td input, td select { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 10px; width: 100%; min-width: 0; }
.field input:focus, .field select:focus { border-color: var(--accent); }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; min-height: 140px; resize: vertical; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; font-weight: 600; padding-bottom: 8px; white-space: nowrap; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
.checks .mark { flex: none; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; }
.checks .mark.ok { background: var(--ok-soft); color: var(--ok); }
.checks .mark.err { background: var(--err-soft); color: var(--err); }

.daychecks { display: flex; flex-wrap: wrap; gap: 6px; }
.daychecks label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font-size: 0.92rem; }
.note { font-size: 0.9rem; color: var(--muted); margin: 0; max-width: 70ch; }
.banner { padding: 12px 16px; border-radius: 6px; font-size: 0.95rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }

/* Año */
.ypl { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.yp { display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
.yp .av { width: 24px; height: 24px; box-shadow: none; }
table.year td { padding-block: 6px; }
tr.nowrow td { background: var(--accent-soft); }
.nowrap { white-space: nowrap; }
.hol { font-size: 0.78rem; font-weight: 700; color: var(--warn); }
.holrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }

/* Selector de avatar */
.avpick { display: flex; flex-wrap: wrap; gap: 8px; }
.avpick label { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; font-weight: 600; color: var(--muted); cursor: pointer; width: 74px; text-align: center; line-height: 1.1; }
.avpick input { position: absolute; opacity: 0; pointer-events: none; }
.avpick .av { width: 46px; height: 46px; }
.avpick input:checked + .av { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.avpick input:focus-visible + .av { outline: 2px solid var(--accent); outline-offset: 3px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--brand); color: var(--on-brand); padding: 11px 18px; border-radius: 6px; font-size: 0.95rem; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); z-index: 20; border-left: 4px solid var(--accent); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } } }
</style>
</head><!--wrap-->
<body><!--wrap-->
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" fill="none" stroke="currentColor" stroke-width="4.5"/><text x="32" y="38.5" text-anchor="middle" font-family="Titillium Web, sans-serif" font-weight="600" font-size="25" fill="currentColor">Cb</text><rect x="17" y="45" width="30" height="2.6" rx="1.3" fill="#50c4ca"/></svg>
        <div>
          <div class="eyebrow">Cuadrante de turnos</div>
          <h1>Farmacia Carlos Casado Buigues</h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Secciones">

<script>
(function () {
  'use strict';

  // ---------- Constantes ----------
  const KEY = 'farmacia-ccb-turnos-v2';
  const ROLES = {
    titular:    { label: 'Farmacéutica/o titular',   short: 'Titular',   abbr: 'TIT', pharm: true,  order: 1 },
    adjunto:    { label: 'Farmacéutica/o adjunta/o', short: 'Adjunto',   abbr: 'ADJ', pharm: true,  order: 0 },
    tecnico:    { label: 'Técnico en farmacia',      short: 'Técnico',   abbr: 'TÉC', pharm: false, order: 2 },
    auxiliar:   { label: 'Auxiliar de farmacia',     short: 'Auxiliar',  abbr: 'AUX', pharm: false, order: 2 },
    estudiante: { label: 'Estudiante en prácticas',  short: 'Prácticas', abbr: 'PRÁ', pharm: false, order: 3 }
  };
  const RESP = {
    mostrador: 'Mostrador',
    admin: 'Administración',
    gestion: 'Gestión',
    practicas: 'Prácticas tutorizadas'
  };
  const RESP_SHORT = { mostrador: 'Mostrador', admin: 'Administrac.', gestion: 'Gestión', practicas: 'Prácticas' };
  const SHIFTS = ['M', 'T'];
  const SH_LABEL = { M: 'Mañana', T: 'Tarde' };
  const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const need = sh => (S.settings.min && S.settings.min[sh]) || 3;

  // ---------- Utilidades de fecha ----------
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
  const todayKey = () => ymd(new Date());
  const shortDate = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
  const longDate = d => DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  const weekIndex = monday => Math.floor(Math.round(monday.getTime() / 864e5 + 3) / 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---------- Datos ----------
  function seed() {
    const today = new Date();
    const since = ymd(addDays(today, -400));
    const staff = [
      { id: 's2', name: 'Ramiro González', role: 'adjunto',  shift: altCode('M') },
      { id: 's3', name: 'Lucía Rojo',      role: 'tecnico',  shift: altCode('T'), lead: true },
      { id: 's4', name: 'Anastasia',       role: 'auxiliar', shift: 'M', senior: true },
      { id: 's5', name: 'Aizane',          role: 'auxiliar', shift: 'M' },
      { id: 's6', name: 'Lorena',          role: 'auxiliar', shift: 'T' }
    ].map(p => Object.assign(p, { active: true, since: since, until: null }));
    return { version: 8, settings: { open: '09:00', mStart: '08:30', tStart: '14:30', days: [1, 2, 3, 4, 5, 6], min: { M: 3, T: 2 }, sat: { close: '14:00', min: 2 } }, staff, schedule: {} };
  }

  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.staff)) S = seed();
  if (!S.version || S.version < 3) {
    // Lucía Rojo pasa a técnico; las tardes se cubren con 2 personas hasta la temporada alta.
    const lucia = S.staff.find(p => p.name === 'Lucía Rojo' && p.role === 'adjunto');
    if (lucia) {
      lucia.role = 'tecnico';
      const ramiro = S.staff.find(p => p.active && p.role === 'adjunto');
      Object.keys(S.schedule).forEach(k => { S.schedule[k].T && S.schedule[k].T.forEach(a => { if (a.id === lucia.id && a.resp === 'gestion') a.resp = 'mostrador'; }); });
    }
    S.settings.min = S.settings.min || { M: 3, T: 2 };
    S.version = 3;
  }
  if (S.version < 4) {
    // Ramiro alterna mañana/tarde cada día y Lucía, responsable de turno, hace el turno contrario.
    const ramiro = S.staff.find(p => p.name === 'Ramiro González');
    const lucia = S.staff.find(p => p.name === 'Lucía Rojo');
    if (lucia) lucia.lead = true;
    const t = ymd(new Date());
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 4;
  }
  if (S.version < 5) {
    // Turnos por semanas completas: Ramiro y Lucía alternan semana a semana, uno de mañana y otra de tarde.
    // Las guardias se gestionan fuera de la aplicación.
    S.staff.forEach(p => { if (p.shift === 'X' || p.shift === 'DM') p.shift = altCode('M'); else if (p.shift === 'DT') p.shift = altCode('T'); });
    delete S.guards;
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 5;
  }
  if (S.version < 6) {
    // Sábados de 9:00 a 14:00 con 2 personas en rotación; Anastasia puede llevar el sábado.
    S.settings.sat = S.settings.sat || { close: '14:00', min: 2 };
    const ana = S.staff.find(p => p.name === 'Anastasia');
    if (ana) ana.senior = true;
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 6;
  }
  if (S.version < 7) {
    // El turno de mañana entra a las 8:30 de lunes a viernes.
    S.settings.mStart = '08:30';
    S.version = 7;
  }
  if (S.version < 8) {
    // La tarde entra a las 14:30: media hora de solape con la mañana.
    S.settings.tStart = '14:30';
    S.version = 8;
  }
  let openYearView = false;
  if (S.version < 9) {
    // Turnos de 2027 tomados del Excel «HORARIO 2027 turnos v2» (Drive):
    // Ramiro y Luci alternan por semanas (Ramiro empieza de mañana el 4-ene-2027),
    // Lorena y Aizane siempre de mañana, Nas (Anastasia) siempre de tarde.
    const find = n => S.staff.find(p => p.name.split(' ')[0] === n);
    const ramiro = find('Ramiro'), lucia = find('Lucía'), lorena = find('Lorena'), aizane = find('Aizane'), nas = find('Anastasia');
    S.weekPlan = S.weekPlan || {};
    const start = new Date(2027, 0, 4);
    for (let w = 0; w < 54; w++) {
      const plan = {};
      if (ramiro) plan[ramiro.id] = w % 2 ? 'T' : 'M';
      if (lucia) plan[lucia.id] = w % 2 ? 'M' : 'T';
      if (lorena) plan[lorena.id] = 'M';
      if (aizane) plan[aizane.id] = 'M';
      if (nas) plan[nas.id] = 'T';
      S.weekPlan[ymd(addDays(start, w * 7))] = plan;
    }
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-01-04') delete S.schedule[k]; });
    S.version = 9;
    openYearView = true;
  }
  if (S.version < 10) {
    // Ramiro empieza 2027 de tarde (sigue la rutina de 2026) y Luci de mañana.
    const ramiro = S.staff.find(p => p.name.split(' ')[0] === 'Ramiro');
    const lucia = S.staff.find(p => p.name.split(' ')[0] === 'Lucía');
    Object.keys(S.weekPlan || {}).forEach(k => {
      const plan = S.weekPlan[k];
      if (ramiro && plan[ramiro.id]) plan[ramiro.id] = plan[ramiro.id] === 'M' ? 'T' : 'M';
      if (lucia && plan[lucia.id]) plan[lucia.id] = plan[lucia.id] === 'M' ? 'T' : 'M';
    });
    // Festivos: nacionales + locales (5 de agosto y 22 de octubre). La farmacia cierra esos días.
    S.holidays = Object.assign({
      '2026-12-08': 'Inmaculada Concepción',
      '2026-12-25': 'Navidad',
      '2027-01-01': 'Año Nuevo',
      '2027-01-06': 'Epifanía del Señor',
      '2027-03-26': 'Viernes Santo',
      '2027-05-01': 'Fiesta del Trabajo',
      '2027-08-05': 'Fiesta local',
      '2027-08-15': 'Asunción de la Virgen',
      '2027-10-12': 'Fiesta Nacional de España',
      '2027-10-22': 'Fiesta local',
      '2027-11-01': 'Todos los Santos',
      '2027-12-06': 'Día de la Constitución',
      '2027-12-08': 'Inmaculada Concepción',
      '2027-12-25': 'Navidad'
    }, S.holidays || {});
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 10;
    openYearView = true;
  }
  if (S.version < 11) {
    // Festivos autonómicos de la Comunitat Valenciana que se repiten cada año.
    S.holidays = S.holidays || {};
    S.holidays['2027-03-29'] = S.holidays['2027-03-29'] || 'Lunes de Pascua (Comunitat Valenciana)';
    S.holidays['2027-10-09'] = S.holidays['2027-10-09'] || 'Día de la Comunitat Valenciana';
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-03-29') delete S.schedule[k]; });
    S.version = 11;
  }
  if (S.version < 12) {
    // Calendario laboral 2027 de la Comunitat Valenciana confirmado por la farmacia:
    // se añade San José; el 15 de agosto cae en domingo y no figura en el calendario.
    S.holidays = S.holidays || {};
    S.holidays['2027-03-19'] = 'San José';
    delete S.holidays['2027-08-15'];
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-03-15') delete S.schedule[k]; });
    S.version = 12;
  }
  if (S.version < 13) {
    // Los festivos no mueven la rotación de sábados.
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-04-26') delete S.schedule[k]; });
    S.version = 13;
  }
  if (S.version < 14) {
    // Avatares frikis para el equipo.
    const av = { Ramiro: 'jedi', 'Lucía': 'duquesa', Anastasia: 'once', Aizane: 'dragones', Lorena: 'miercoles' };
    S.staff.forEach(p => { if (!p.avatar) p.avatar = av[p.name.split(' ')[0]] || 'droide'; });
    S.version = 14;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ } }

  const ui = { tab: 'cuadrante', week: mondayOf(new Date()), year: 2027, confirm: null, editing: null };
  try { const t = localStorage.getItem(KEY + ':tab'); if (t) ui.tab = t; } catch (e) {}
  if (openYearView) { ui.tab = 'anual'; save(); }

  // ---------- Helpers de dominio ----------
  const byId = id => S.staff.find(p => p.id === id);
  const isPharm = p => !!p && ROLES[p.role].pharm;
  const activeStaff = () => S.staff.filter(p => p.active);
  const activeOn = (p, key) => p.active || (p.until && key < p.until);
  const firstName = id => { const p = byId(id); return p ? p.name.split(' ')[0] : '—'; };
  const shortName = p => { const parts = p.name.trim().split(/\s+/); return parts.length > 1 ? parts[0] + ' ' + parts[1][0] + '.' : parts[0]; };
  const openMin = () => { const [h, m] = S.settings.open.split(':').map(Number); return h * 60 + m; };
  const mStartMin = () => { const [h, m] = (S.settings.mStart || S.settings.open).split(':').map(Number); return h * 60 + m; };
  const tStartMin = () => { const v = S.settings.tStart; if (!v) return openMin() + 360; const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const times = sh => { const o = openMin(); return sh === 'M' ? [Math.min(mStartMin(), o), o + 360] : [Math.min(tStartMin(), o + 360), o + 720]; };
  const fmtH = h => String(Math.round(h * 10) / 10).replace('.', ',') + ' h';
  const hm = m => pad(Math.floor((m % 1440) / 60)) + ':' + pad(m % 60);
  const range = sh => hm(times(sh)[0]) + '–' + hm(times(sh)[1]);
  const holidayOf = d => (S.holidays || {})[ymd(d)];
  const isOpenDay = d => S.settings.days.includes(d.getDay()) && !holidayOf(d);
  // Turno de la semana: fijo (M/T) o alterno por semanas (WM: mañana en semanas pares, WT: al revés).
  // Toda la semana se hace el mismo turno.
  const effPref = (p, monday) => {
    const plan = S.weekPlan && S.weekPlan[ymd(monday)];
    if (plan && plan[p.id]) return plan[p.id];
    const even = weekIndex(monday) % 2 === 0;
    if (p.shift === 'WM') return even ? 'M' : 'T';
    if (p.shift === 'WT') return even ? 'T' : 'M';
    return p.shift === 'T' ? 'T' : 'M';
  };
  // Código de alternancia que hace mañana (o tarde) en la semana actual.
  function altCode(sh) { const even = weekIndex(mondayOf(new Date())) % 2 === 0; return (sh === 'M') === even ? 'WM' : 'WT'; }
  const prefLabel = code => code === 'WM' || code === 'WT'
    ? 'Semanas alternas · esta semana de ' + (effPref({ shift: code }, mondayOf(new Date())) === 'M' ? 'mañana' : 'tarde')
    : code === 'T' ? 'Tarde' : 'Mañana';
  // Responsable de turno: un farmacéutico o una persona marcada como responsable.
  const isLead = p => !!p && (isPharm(p) || !!p.lead);
  // Sábado: jornada corta de mañana con rotación propia.
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const isSat = d => d.getDay() === 6 && !!S.settings.sat;
  const keySat = key => isSat(parse(key));
  const dayShifts = key => keySat(key) ? ['M'] : SHIFTS;
  const shTimes = (key, sh) => keySat(key) ? [openMin(), toMin(S.settings.sat.close)] : times(sh);
  const shRange = (key, sh) => hm(shTimes(key, sh)[0]) + '–' + hm(shTimes(key, sh)[1]);
  const shHours = (key, sh) => { const [a, b] = shTimes(key, sh); return (b - a) / 60; };
  const needOn = (key, sh) => keySat(key) ? S.settings.sat.min : need(sh);
  const canLeadSat = p => isLead(p) || !!(p && p.senior);
  const satRange = () => hm(openMin()) + '–' + S.settings.sat.close;

  // Rotación de sábados: reparto equitativo y estable. Se simula semana a semana desde una semana fija:
  // cada sábado entran quienes menos sábados llevan (y hace más que no trabajan uno),
  // y siempre al menos una persona que pueda llevar el sábado.
  const SAT_ANCHOR = new Date(2026, 10, 16);
  function satRotation(monday) {
    const team = activeStaff().filter(p => p.role !== 'estudiante');
    const n = Math.min(S.settings.sat.min, team.length);
    const count = {}, last = {};
    team.forEach(p => { count[p.id] = 0; last[p.id] = -99; });
    const steps = Math.max(0, Math.round((monday - SAT_ANCHOR) / (7 * 864e5)));
    let pickNow = [];
    for (let w = 0; w <= steps; w++) {
      // Un sábado festivo cuenta en la rotación igual: a quienes les tocaba, libran ese día.
      const chosen = [];
      for (let k = 0; k < n; k++) {
        let pool = team.filter(p => !chosen.includes(p));
        if (k === n - 1 && !chosen.some(canLeadSat) && pool.some(canLeadSat)) pool = pool.filter(canLeadSat);
        pool.sort((a, b) => count[a.id] - count[b.id] || last[a.id] - last[b.id] || team.indexOf(a) - team.indexOf(b));
        if (pool[0]) chosen.push(pool[0]);
      }
      chosen.forEach(p => { count[p.id]++; last[p.id] = w; });
      pickNow = chosen;
    }
    return pickNow;
  }
  const initials = p => { const w = p.name.trim().split(/\s+/); return w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : w[0].slice(0, 2); };
  // ---------- Avatares frikis (dibujos propios, homenaje en broma) ----------
  const SKIN = '#f1c7a1';
  const eyes = (c = '#1d1d1d', y = 33) => '<circle cx="27.6" cy="' + y + '" r="1.5" fill="' + c + '"/><circle cx="36.4" cy="' + y + '" r="1.5" fill="' + c + '"/>';
  const smile = '<path d="M28.5 38.4q3.5 2.6 7 0" stroke="#7a4636" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
  const face = (skin = SKIN) => '<circle cx="32" cy="34" r="11" fill="' + skin + '"/>';
  const AVATARS = {
    jedi: { label: 'Maestro Jedi', serie: 'Star Wars', svg:
      '<rect width="64" height="64" fill="#16324a"/>' +
      '<circle cx="9" cy="10" r="1" fill="#fff"/><circle cx="20" cy="6" r=".8" fill="#fff"/><circle cx="44" cy="8" r="1" fill="#fff"/><circle cx="57" cy="15" r=".8" fill="#fff"/>' +
      '<path d="M7 64c2-13 11-20 25-20s23 7 25 20z" fill="#9c7650"/>' +
      '<path d="M26 46l6 10 6-10z" fill="#e9dcc0"/>' +
      '<path d="M17 46c0-17 6-29 15-29s15 12 15 29c-3-2-6-3-8-3l-1-12c-1-5-3-7-6-7s-5 2-6 7l-1 12c-2 0-5 1-8 3z" fill="#7a5534"/>' +
      face() + eyes() +
      '<path d="M22.5 37c1 7 5 10 9.5 10s8.5-3 9.5-10c-2 2-5 3-9.5 3s-7.5-1-9.5-3z" fill="#b9b2a6"/>' +
      '<line x1="55" y1="54" x2="55" y2="16" stroke="#7dff8a" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>' +
      '<line x1="55" y1="54" x2="55" y2="16" stroke="#d9ffdc" stroke-width="2.5" stroke-linecap="round"/>' +
      '<rect x="52.8" y="53" width="4.4" height="10" rx="1" fill="#a9b4ba"/>' },
    once: { label: 'Once', serie: 'Stranger Things', svg:
      '<rect width="64" height="64" fill="#23151b"/>' +
      '<path d="M0 9q16 9 32 3t32 3" stroke="#3b3b3b" stroke-width="1.2" fill="none"/>' +
      '<circle cx="8" cy="12" r="2.4" fill="#ff4b4b"/><circle cx="20" cy="14" r="2.4" fill="#ffd23f"/><circle cx="32" cy="12" r="2.4" fill="#4bd36b"/><circle cx="44" cy="12.5" r="2.4" fill="#4b9bff"/><circle cx="56" cy="14" r="2.4" fill="#ff7bd5"/>' +
      '<path d="M9 64c2-12 10-18 23-18s21 6 23 18z" fill="#f3a6bb"/>' +
      '<path d="M24 46l8 6 8-6z" fill="#fff"/>' +
      face() +
      '<path d="M21 31a11 11 0 0 1 22 0c-2-4.5-6-6.5-11-6.5s-9 2-11 6.5z" fill="#6a4a34"/>' +
      eyes() + '<path d="M29 38.8h6" stroke="#7a4636" stroke-width="1.4" stroke-linecap="round"/>' +
      '<path d="M31.2 36.2v3.6" stroke="#d81f2a" stroke-width="1.6" stroke-linecap="round"/>' +
      '<rect x="44" y="47" width="13" height="13" rx="2.5" fill="#e3ad4d"/>' +
      '<path d="M48.3 47v13M52.6 47v13M44 51.3h13M44 55.6h13" stroke="#b77d22" stroke-width="1.1"/>' },
    duquesa: { label: 'La Duquesa', serie: 'Los Bridgerton', svg:
      '<rect width="64" height="64" fill="#cfe2f4"/>' +
      '<circle cx="12" cy="52" r="7" fill="#f6c6d4"/><circle cx="54" cy="54" r="6" fill="#f6c6d4"/>' +
      '<path d="M8 64c3-12 11-17 24-17s21 5 24 17z" fill="#8db4de"/>' +
      '<path d="M20 50q12 8 24 0l-2 6q-10 5-20 0z" fill="' + SKIN + '"/>' +
      '<path d="M22 52q10 6 20 0" stroke="#fff" stroke-width="2.2" stroke-dasharray="0.1 3.2" stroke-linecap="round" fill="none"/>' +
      '<circle cx="32" cy="16" r="6" fill="#6b3b26"/>' +
      '<path d="M20 34c0-9 5-14 12-14s12 5 12 14c-2-5-6-8-12-8s-10 3-12 8z" fill="#6b3b26"/>' +
      face() + eyes() + smile +
      '<circle cx="25.5" cy="37" r="2" fill="#f19aa8" opacity=".6"/><circle cx="38.5" cy="37" r="2" fill="#f19aa8" opacity=".6"/>' +
      '<path d="M25 24l2.5-4 2 3 2.5-4.5 2.5 4.5 2-3 2.5 4z" fill="#e5b93c"/>' +
      '<path d="M20 33c-2 5-1 9 1 11" stroke="#6b3b26" stroke-width="2.5" fill="none" stroke-linecap="round"/>' },
    dragones: { label: 'Madre de dragones', serie: 'Juego de Tronos', svg:
      '<rect width="64" height="64" fill="#2c2238"/>' +
      '<path d="M9 64c2-12 10-18 23-18s21 6 23 18z" fill="#34507e"/>' +
      '<path d="M18 58c-1-16-1-27 2-33s8-9 12-9 9 3 12 9 3 17 2 33l-5 2c1-12 1-20-1-25-2-4-5-6-8-6s-6 2-8 6c-2 5-2 13-1 25z" fill="#f1ead6"/>' +
      face() + eyes('#3a3a60') + smile +
