      '<circle cx="40" cy="31" r="1.4" fill="#ff4b4b"/></g>' }
  };
  const AV_DEFAULT = { s2: 'jedi', s3: 'duquesa', s4: 'once', s5: 'dragones', s6: 'miercoles' };
  const avKey = p => (p.avatar && AVATARS[p.avatar]) ? p.avatar : (AV_DEFAULT[p.id] || 'droide');
  const avatar = p => { const a = AVATARS[avKey(p)]; return '<span class="av" title="' + esc(a.label + ' · ' + a.serie) + '" aria-hidden="true"><svg viewBox="0 0 64 64">' + a.svg + '</svg></span>'; };
  const avCaption = p => { const a = AVATARS[avKey(p)]; return a.label + ' · ' + a.serie; };
  const avPicker = (name, sel) => '<div class="avpick" role="radiogroup" aria-label="Avatar">' + Object.keys(AVATARS).map(k =>
    '<label><input type="radio" name="' + name + '" value="' + k + '"' + (k === sel ? ' checked' : '') + '><span class="av"><svg viewBox="0 0 64 64">' + AVATARS[k].svg + '</svg></span>' + esc(AVATARS[k].label) + '</label>').join('') + '</div>';
  const roleBadge = p => '<span class="badge role-' + p.role + '">' + ROLES[p.role].short + '</span>';

  // ---------- Generador de cuadrante ----------
  function assignResp(people, seedIdx) {
    const out = people.map(p => ({ id: p.id, resp: null }));
    const ph = out.filter(a => isLead(byId(a.id)))
      .sort((a, b) => ROLES[byId(a.id).role].order - ROLES[byId(b.id).role].order);
    // El responsable del turno (preferiblemente el farmacéutico) supervisa el mostrador; si hay otro, gestión.
    ph.forEach((a, k) => { a.resp = k === 0 || out.length <= 2 ? 'mostrador' : 'gestion'; });
    out.filter(a => byId(a.id).role === 'estudiante').forEach(a => { a.resp = 'practicas'; });
    const aux = out.filter(a => !a.resp);
    let counter = out.filter(a => a.resp === 'mostrador').length + aux.length;
    const adminIdx = aux.length ? seedIdx % aux.length : -1;
    aux.forEach((a, k) => {
      // Siempre al menos 2 personas en mostrador; si sobra una, pasa a administración (rota por día).
      if (k === adminIdx && counter - 1 >= 2) { a.resp = 'admin'; counter--; } else a.resp = 'mostrador';
    });
    return out;
  }

  function generateWeek(monday) {
    const today = todayKey();
    const act = activeStaff();
    const hours = {};
    let changed = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      const existing = S.schedule[key];
      // No se reescriben días pasados que ya tienen cuadrante.
      if (key < today && existing) {
        SHIFTS.forEach(sh => (existing[sh] || []).forEach(a => { hours[a.id] = (hours[a.id] || 0) + shHours(key, sh); }));
        continue;
      }
      if (!isOpenDay(d)) { delete S.schedule[key]; continue; }
      if (isSat(d)) {
        const list = satRotation(monday);
        list.forEach(p => { hours[p.id] = (hours[p.id] || 0) + shHours(key, 'M'); });
        S.schedule[key] = { M: assignResp(list, i), T: [] };
        changed++;
        continue;
      }
      const day = { M: [], T: [] };
      const used = new Set();
      SHIFTS.forEach(sh => {
        const score = p => {
          const pref = effPref(p, monday);
          return (pref === sh ? 0 : 2000) + (used.has(p.id) ? 10000 : 0) + (hours[p.id] || 0);
        };
        const pick = pool => pool.slice().sort((a, b) => score(a) - score(b) || ROLES[a.role].order - ROLES[b.role].order)[0];
        const list = [];
        // Un responsable por turno (farmacéutico o responsable designado); nadie dobla turno automáticamente.
        const ph = pick(act.filter(p => isLead(p) && !used.has(p.id)));
        if (ph) list.push(ph);
        while (list.length < need(sh)) {
          const c = pick(act.filter(p => p.role !== 'estudiante' && !list.includes(p) && !used.has(p.id)));
          if (!c) break;
          list.push(c);
        }
        act.filter(p => p.role === 'estudiante' && !used.has(p.id) && effPref(p, monday) === sh)
          .forEach(p => list.push(p));
        list.forEach(p => { used.add(p.id); hours[p.id] = (hours[p.id] || 0) + 6; });
        day[sh] = assignResp(list, i + (sh === 'T' ? 1 : 0));
      });
      S.schedule[key] = day;
      changed++;
    }
    save();
    return changed;
  }

  function weekHasData(monday) {
    for (let i = 0; i < 7; i++) if (S.schedule[ymd(addDays(monday, i))]) return true;
    return false;
  }

  // ---------- Validación ----------
  function shiftIssues(key, sh) {
    const day = S.schedule[key];
    const list = (day && day[sh]) || [];
    const out = [];
    const people = list.map(a => byId(a.id)).filter(Boolean);
    const valid = people.filter(p => activeOn(p, key));
    const count = valid.filter(p => p.role !== 'estudiante').length;
    if (keySat(key)) { if (!valid.some(canLeadSat)) out.push({ lvl: 'err', t: 'Falta alguien que pueda llevar el sábado' }); }
    else if (!valid.some(isLead)) out.push({ lvl: 'err', t: 'Sin farmacéutico ni responsable' });
    const n = needOn(key, sh);
    if (count < n) out.push({ lvl: 'err', t: 'Falta' + (n - count > 1 ? 'n ' : ' ') + (n - count) + (n - count > 1 ? ' personas' : ' persona') });
    if (count > n) out.push({ lvl: 'info', t: 'Refuerzo: ' + count + ' personas' });
    if (valid.length && !list.some(a => a.resp === 'mostrador' && byId(a.id) && activeOn(byId(a.id), key))) out.push({ lvl: 'warn', t: 'Nadie en mostrador' });
    people.filter(p => !activeOn(p, key)).forEach(p => out.push({ lvl: 'err', t: shortName(p) + ' está de baja' }));
    const other = (day && day[sh === 'M' ? 'T' : 'M']) || [];
    valid.forEach(p => { if (other.some(a => a.id === p.id)) out.push({ lvl: 'warn', t: shortName(p) + ' dobla turno (12 h)' }); });
    return out;
  }

  function weekIssueCount(monday) {
    let err = 0, warn = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      if (!isOpenDay(d) && !S.schedule[key]) continue;
      dayShifts(key).forEach(sh => shiftIssues(key, sh).forEach(x => { if (x.lvl === 'err') err++; else if (x.lvl === 'warn') warn++; }));
    }
    return { err, warn };
  }

  // ---------- Render: estado actual ----------
  function renderNow() {
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const key = ymd(now);
    let label = 'Ahora · ' + hm(mins), state, people = '';
    const nowShifts = dayShifts(key).filter(sh => { const [a, b] = shTimes(key, sh); return mins >= a && mins < b; });
    const shiftNow = nowShifts[nowShifts.length - 1];
    const day = S.schedule[key];
    if (isOpenDay(now) && shiftNow && day) {
      state = nowShifts.length > 1 ? 'Cambio de turno <span class="mono muted">' + hm(shTimes(key, 'T')[0]) + '–' + hm(shTimes(key, 'M')[1]) + '</span>'
        : (keySat(key) ? 'Sábado' : 'Turno de ' + SH_LABEL[shiftNow].toLowerCase()) + ' <span class="mono muted">' + shRange(key, shiftNow) + '</span>';
      people = [].concat(...nowShifts.map(sh => day[sh] || [])).map(a => {
        const p = byId(a.id); if (!p) return '';
        return '<span class="who role-' + p.role + '">' + avatar(p) + '<span class="who-t"><strong>' + esc(p.name) + '</strong><small>' + ROLES[p.role].short + ' · ' + RESP[a.resp] + '</small></span></span>';
      }).join('');
    } else {
      state = 'Cerrado';
      people = '<span class="soft">' + nextOpening(now) + '</span>';
    }
    document.getElementById('now').innerHTML =
      '<div><div class="label"><span class="live"></span>' + label + '</div><div class="state">' + state + '</div></div>' +
      '<div class="people">' + people + '</div>';
    document.getElementById('subtitle').textContent =
      'Abierto ' + hm(times('M')[0]) + '–' + hm(times('T')[1]) + (S.settings.sat && S.settings.days.includes(6) ? ' · sábados ' + satRange() : '') + ' · ' + need('M') + ' personas de mañana y ' + need('T') + ' de tarde';
  }
  function nextOpening(now) {
    const mins = now.getHours() * 60 + now.getMinutes();
    for (let i = 0; i < 8; i++) {
      const d = addDays(now, i);
      if (!isOpenDay(d)) continue;
      if (i === 0 && mins >= times('M')[0]) continue;
      return 'Próxima apertura: ' + (i === 0 ? 'hoy' : i === 1 ? 'mañana' : DAYS[d.getDay()].toLowerCase()) + ' a las ' + hm(times('M')[0]);
    }
    return 'No hay días de apertura configurados';
  }

  // ---------- Render: cuadrante ----------
  function renderCuadrante() {
    const monday = ui.week;
    if (!weekHasData(monday) && ymd(addDays(monday, 6)) >= todayKey()) generateWeek(monday);
    const sunday = addDays(monday, 6);
    const rangeTxt = monday.getMonth() === sunday.getMonth()
      ? monday.getDate() + '–' + sunday.getDate() + ' ' + MONTHS[sunday.getMonth()] + ' ' + sunday.getFullYear()
      : shortDate(monday) + ' – ' + shortDate(sunday) + ' ' + sunday.getFullYear();
    const ic = weekIssueCount(monday);
    const status = ic.err ? '<span class="pill err">' + ic.err + (ic.err > 1 ? ' turnos con problemas' : ' turno con problemas') + '</span>'
      : ic.warn ? '<span class="pill warn">' + ic.warn + (ic.warn > 1 ? ' avisos' : ' aviso') + '</span>'
      : '<span class="pill ok">✓ Todos los turnos cubiertos</span>';
    const regen = ui.confirm === 'regen'
      ? '<span class="muted" style="font-size:.85rem">Se sustituyen los cambios manuales desde hoy.</span><button class="btn primary sm" data-act="regen-yes">Generar</button><button class="btn sm" data-act="cancel">Cancelar</button>'
      : '<button class="btn primary" data-act="regen">Generar cuadrante</button>';

    let html = '<div class="stack">' +
      '<div class="weekbar">' +
        '<div class="weeknav">' +
          '<button class="btn round" data-act="prev" aria-label="Semana anterior">‹</button>' +
          '<span class="range">' + rangeTxt + '</span>' +
          '<button class="btn round" data-act="next" aria-label="Semana siguiente">›</button>' +
          '<button class="btn sm" data-act="thisweek">Esta semana</button>' +
          status +
        '</div>' +
        '<div class="actions">' + regen + '</div>' +
      '</div>' +
      shortBanner() +
      '<div class="legend">' +
        Object.keys(ROLES).filter(r => r === 'estudiante' || activeStaff().some(p => p.role === r)).map(r => '<span class="role-' + r + '"><span class="dot"></span>' + ROLES[r].label + '</span>').join('') +
      '</div>' +
      '<div class="week">';

    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      const isToday = key === todayKey();
      const head = '<header><span><span class="dname">' + DAYS[d.getDay()] + '</span> <span class="ddate">' + shortDate(d) + '</span></span>' + (isToday ? '<span class="todaytag">Hoy</span>' : '') + '</header>';
      if (!isOpenDay(d) && !S.schedule[key]) {
        html += '<article class="day closed' + (isToday ? ' today' : '') + '">' + head + '<div class="closedmsg">' + (holidayOf(d) ? '<span class="pill warn">Festivo</span> ' + esc(holidayOf(d)) +
          (d.getDay() === 6 && S.settings.sat ? '<br>Libran: ' + satRotation(monday).map(p => esc(p.name.split(' ')[0])).join(' y ') : '') : 'Cerrado') + '</div></article>';
        continue;
      }
      html += '<article class="day' + (isToday ? ' today' : '') + '">' + head;
      dayShifts(key).forEach(sh => {
        const list = (S.schedule[key] && S.schedule[key][sh]) || [];
        const iss = shiftIssues(key, sh);
        const ok = !iss.some(x => x.lvl === 'err');
        html += '<section class="shift sh-' + sh + '"><div class="shift-h"><span><strong>' + (keySat(key) ? 'Mañana' : SH_LABEL[sh]) + '</strong><span class="mono">' + shRange(key, sh) + '</span></span>' +
          '<span class="pill ' + (ok ? 'ok' : 'err') + '" title="' + (ok ? 'Turno cubierto' : 'Turno incompleto') + '">' + list.filter(a => byId(a.id) && activeOn(byId(a.id), key) && byId(a.id).role !== 'estudiante').length + '/' + needOn(key, sh) + '</span></div><ul>';
        list.forEach(a => {
          const p = byId(a.id); if (!p) return;
          html += '<li class="pp role-' + p.role + (activeOn(p, key) ? '' : ' gone') + '">' + avatar(p) + '<span class="nm" title="' + esc(p.name + ' · ' + ROLES[p.role].label) + '"><span class="n">' + esc(p.name.trim().split(/\s+/)[0]) + '</span><span class="r">' + ROLES[p.role].short + (p.lead && !isPharm(p) ? ' · Resp.' : '') + '</span></span>' +
            '<select class="resp" data-resp="' + a.resp + '" data-act="resp" data-key="' + key + '" data-sh="' + sh + '" data-id="' + p.id + '" aria-label="Responsabilidad de ' + esc(p.name) + '">' +
            Object.keys(RESP).map(r => '<option value="' + r + '"' + (r === a.resp ? ' selected' : '') + '>' + RESP_SHORT[r] + '</option>').join('') + '</select>' +
            '<button class="iconbtn" data-act="rm" data-key="' + key + '" data-sh="' + sh + '" data-id="' + p.id + '" aria-label="Quitar a ' + esc(p.name) + ' del turno">×</button></li>';
        });
        html += '</ul>';
        if (iss.length) html += '<div class="issues">' + iss.map(x => '<span class="issue ' + x.lvl + '">' + esc(x.t) + '</span>').join('') + '</div>';
        const avail = activeStaff().filter(p => !list.some(a => a.id === p.id));
        if (avail.length) {
          html += '<select class="add" data-act="add" data-key="' + key + '" data-sh="' + sh + '" aria-label="Añadir persona al turno de ' + SH_LABEL[sh].toLowerCase() + '"><option value="">+ Añadir persona…</option>' +
            avail.map(p => '<option value="' + p.id + '">' + esc(p.name) + ' (' + ROLES[p.role].short + ')</option>').join('') + '</select>';
        }
        html += '</section>';
      });
      html += '</article>';
    }
    html += '</div>' + renderWeekSummary(monday) + '</div>';
    return html;
  }

  function shortBanner() {
    const team = activeStaff().filter(p => p.role !== 'estudiante').length;
    if (team >= need('M') + need('T')) return '';
    const miss = need('M') + need('T') - team;
    return '<div class="banner warn"><span>Con ' + team + ' personas no se cubren ' + need('M') + ' por la mañana y ' + need('T') + ' por la tarde sin doblar turno: ' +
      (miss > 1 ? 'faltan ' + miss + ' personas' : 'falta 1 persona') + ' cada día. Da de alta a alguien o añádelo a mano en el turno.</span>' +
      '<button class="btn sm" data-tab="equipo">Ir a Equipo</button></div>';
  }

  function renderWeekSummary(monday) {
    const rows = {};
    for (let i = 0; i < 7; i++) {
      const key = ymd(addDays(monday, i));
      const day = S.schedule[key]; if (!day) continue;
      SHIFTS.forEach(sh => (day[sh] || []).forEach(a => {
        const r = rows[a.id] || (rows[a.id] = { M: 0, T: 0, S: 0, h: 0, mostrador: 0, admin: 0, gestion: 0, practicas: 0 });
        r[keySat(key) ? 'S' : sh]++; r[a.resp]++; r.h += shHours(key, sh);
      }));
    }
    const people = S.staff.filter(p => p.active || rows[p.id])
      .sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    return '<section class="panel"><div class="panel-h"><h2>Resumen de la semana</h2><span class="muted" style="font-size:.85rem">Mañana: ' + fmtH((times('M')[1] - times('M')[0]) / 60) + ' · tarde: ' + fmtH((times('T')[1] - times('T')[0]) / 60) + (S.settings.sat ? ' · sábado: ' + fmtH((toMin(S.settings.sat.close) - openMin()) / 60) : '') + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Persona</th><th>Rol</th><th class="num">Mañanas</th><th class="num">Tardes</th><th class="num">Sábados</th><th class="num">Horas</th><th class="num">Mostrador</th><th class="num">Admin.</th><th class="num">Gestión</th></tr></thead><tbody>' +
      people.map(p => {
        const r = rows[p.id] || { M: 0, T: 0, S: 0, h: 0, mostrador: 0, admin: 0, gestion: 0, practicas: 0 };
        return '<tr><td><span class="person">' + avatar(p) + esc(p.name) + (p.active ? '' : ' <span class="muted">(baja)</span>') + '</span></td><td>' + roleBadge(p) + '</td>' +
          '<td class="num">' + r.M + '</td><td class="num">' + r.T + '</td><td class="num">' + r.S + '</td><td class="num"><strong>' + fmtH(r.h) + '</strong></td>' +
          '<td class="num">' + r.mostrador + '</td><td class="num">' + r.admin + '</td><td class="num">' + r.gestion + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  // ---------- Render: equipo ----------
  function staffChecks() {
    const act = activeStaff();
    const adj = act.filter(p => p.role === 'adjunto').length;
    const team = act.filter(p => p.role !== 'estudiante').length;
    const leads = act.filter(isLead).length;
    const satLeads = act.filter(canLeadSat);
    return [
      { ok: adj >= 1, t: 'Farmacéuticos adjuntos en plantilla: <strong>' + adj + '</strong> (mínimo 1)' },
      { ok: leads >= 2, t: 'Farmacéutico o responsable para mañana y tarde: <strong>' + leads + '</strong> (mínimo 2)' },
      { ok: team >= need('M') + need('T'), t: 'Personas para ' + need('M') + ' de mañana + ' + need('T') + ' de tarde: <strong>' + team + '</strong> (mínimo ' + (need('M') + need('T')) + ')' },
      { ok: satLeads.length >= 1, t: 'Pueden llevar el sábado: <strong>' + (satLeads.map(p => esc(p.name.split(' ')[0])).join(', ') || 'nadie') + '</strong>' },
    ];
  }

  function renderEquipo() {
    const act = activeStaff().sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const gone = S.staff.filter(p => !p.active);
    const monday = mondayOf(new Date());
    const hoursWeek = id => {
      let h = 0;
      for (let i = 0; i < 7; i++) { const day = S.schedule[ymd(addDays(monday, i))]; const k = ymd(addDays(monday, i)); if (day) SHIFTS.forEach(sh => { if ((day[sh] || []).some(a => a.id === id)) h += shHours(k, sh); }); }
      return h;
    };
    const roleOpts = sel => Object.keys(ROLES).map(r => '<option value="' + r + '"' + (r === sel ? ' selected' : '') + '>' + ROLES[r].label + '</option>').join('');
    const prefOpts = sel => ['M', 'T', altCode('M'), altCode('T')].map(c => '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + prefLabel(c) + '</option>').join('');

    const rows = act.map(p => {
      if (ui.editing === p.id) {
        return '<tr><td><input id="ed-name" value="' + esc(p.name) + '" aria-label="Nombre"></td>' +
          '<td><select id="ed-role" aria-label="Rol">' + roleOpts(p.role) + '</select></td>' +
          '<td><select id="ed-shift" aria-label="Turno habitual">' + prefOpts(p.shift) + '</select></td><td colspan="2"><label class="chk"><input type="checkbox" id="ed-lead"' + (p.lead ? ' checked' : '') + '> Responsable de turno</label><label class="chk"><input type="checkbox" id="ed-senior"' + (p.senior ? ' checked' : '') + '> Puede llevar el sábado</label></td>' +
          '<td><div class="rowact"><button class="btn primary sm" data-act="ed-save" data-id="' + p.id + '">Guardar</button><button class="btn sm" data-act="cancel">Cancelar</button></div></td></tr>' +
          '<tr><td colspan="6"><div class="field"><label>Avatar</label>' + avPicker('ed-av', avKey(p)) + '</div></td></tr>';
      }
      const confirming = ui.confirm === 'baja:' + p.id;
      return '<tr><td><span class="person">' + avatar(p) + '<span class="pcap">' + esc(p.name) + '<small>' + esc(avCaption(p)) + '</small></span></span></td>' +
        '<td>' + roleBadge(p) + (p.lead && !isPharm(p) ? ' <span class="badge lead">Responsable</span>' : '') + (p.senior && !isLead(p) ? ' <span class="badge lead">Lleva sábado</span>' : '') + '</td><td>' + prefLabel(p.shift) + '</td>' +
        '<td class="mono muted">' + shortDate(parse(p.since)) + ' ' + p.since.slice(0, 4) + '</td>' +
        '<td class="num">' + fmtH(hoursWeek(p.id)) + '</td>' +
        '<td><div class="rowact">' + (confirming
          ? '<span class="muted" style="font-size:.85rem">¿Dar de baja?</span><button class="btn danger solid sm" data-act="baja-yes" data-id="' + p.id + '">Sí, dar de baja</button><button class="btn sm" data-act="cancel">No</button>'
          : '<button class="btn sm" data-act="edit" data-id="' + p.id + '">Editar</button>' + (p.role === 'titular' ? '' : '<button class="btn danger sm" data-act="baja" data-id="' + p.id + '">Dar de baja</button>')) +
        '</div></td></tr>';
    }).join('');

    const goneRows = gone.map(p => '<tr><td><span class="person role-' + p.role + '"><span class="dot"></span>' + esc(p.name) + '</span></td><td>' + roleBadge(p) + '</td>' +
      '<td class="mono muted">' + (p.until ? shortDate(parse(p.until)) + ' ' + p.until.slice(0, 4) : '—') + '</td>' +
      '<td><div class="rowact"><button class="btn sm" data-act="alta-again" data-id="' + p.id + '">Volver a dar de alta</button></div></td></tr>').join('');

    const checks = staffChecks();
    return '<div class="cols">' +
      '<div class="stack">' +
        '<section class="panel"><div class="panel-h"><h2>Dar de alta</h2></div>' +
          '<form class="grid" id="alta-form" autocomplete="off">' +
            '<div class="field"><label for="alta-name">Nombre y apellidos</label><input id="alta-name" required placeholder="Nombre de la persona"></div>' +
            '<div class="field"><label for="alta-role">Rol</label><select id="alta-role">' + roleOpts('auxiliar') + '</select></div>' +
            '<div class="field"><label for="alta-shift">Turno habitual</label><select id="alta-shift">' + prefOpts('M') + '</select></div>' +
            '<label class="chk"><input type="checkbox" id="alta-lead"> Responsable de turno</label>' +
            '<label class="chk"><input type="checkbox" id="alta-senior"> Puede llevar el sábado</label>' +
            '<div class="field" style="grid-column:1/-1"><label>Avatar</label>' + avPicker('alta-av', 'droide') + '</div>' +
            '<button class="btn primary" type="submit">Dar de alta</button>' +
          '</form>' +
          '<p class="note">Los estudiantes en prácticas van como refuerzo tutorizado: no cuentan para el mínimo de personas del turno.</p>' +
        '</section>' +
        '<section class="panel"><div class="panel-h"><h2>Equipo en activo</h2><span class="muted" style="font-size:.85rem">' + act.length + ' personas · horas de esta semana</span></div>' +
          '<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Turno habitual</th><th>Alta</th><th class="num">Horas</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '</section>' +
        (gone.length ? '<section class="panel"><div class="panel-h"><h2>Bajas</h2></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Fecha de baja</th><th></th></tr></thead><tbody>' + goneRows + '</tbody></table></div></section>' : '') +
      '</div>' +
      '<section class="panel"><h2>Requisitos de plantilla</h2><ul class="checks">' +
        checks.map(c => '<li><span class="mark ' + (c.ok ? 'ok' : 'err') + '">' + (c.ok ? '✓' : '!') + '</span><span>' + c.t + '</span></li>').join('') +
      '</ul><p class="note">No se puede dar de baja al último farmacéutico adjunto. Cada turno de entre semana necesita un farmacéutico o una persona responsable de turno. Los sábados rotan entre todo el equipo, siempre con alguien que pueda llevar el sábado. El cuadrante se genera con el turno habitual de cada persona y reparte mostrador, administración y gestión.</p></section>' +
    '</div>';
  }

  // ---------- Render: año ----------
  const isoWeek = d => {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  };
  function yearMondays(year) {
    const out = [];
    for (let m = mondayOf(new Date(year, 0, 4)); addDays(m, 3).getFullYear() === year; m = addDays(m, 7)) out.push(m);
    return out;
  }
  function ensureYear(year) {
    yearMondays(year).forEach(m => { if (!weekHasData(m) && ymd(addDays(m, 6)) >= todayKey()) generateWeek(m); });
  }
  function renderAnual() {
    const year = ui.year;
    ensureYear(year);
    const mondays = yearMondays(year);
    const tot = {};
    const names = list => list.map(a => byId(a.id)).filter(Boolean)
      .map(p => '<span class="yp role-' + p.role + '">' + avatar(p) + esc(p.name.split(' ')[0]) + '</span>').join('');
    const rows = mondays.map(m => {
      let M = null, T = null, sat = null, satKey = null;
      for (let i = 0; i < 7; i++) {
        const key = ymd(addDays(m, i)); const day = S.schedule[key]; if (!day) continue;
        dayShifts(key).forEach(sh => (day[sh] || []).forEach(a => {
          const t = tot[a.id] || (tot[a.id] = { h: 0, S: 0 });
          t.h += shHours(key, sh); if (keySat(key)) t.S++;
        }));
        if (keySat(key)) { sat = day.M || []; satKey = key; }
        else if (!M && day.M && day.M.length) { M = day.M; T = day.T || []; }
      }
      const isNow = ymd(m) === ymd(mondayOf(new Date()));
      return '<tr class="' + (isNow ? 'nowrow' : '') + '"><td class="mono">S' + pad(isoWeek(m)) + '</td>' +
        '<td class="nowrap">' + shortDate(m) + ' – ' + shortDate(addDays(m, 6)) +
          [0, 1, 2, 3, 4, 5, 6].map(i => addDays(m, i)).filter(holidayOf).map(d => '<div class="hol">Festivo ' + DAYS[d.getDay()].slice(0, 3).toLowerCase() + ' ' + shortDate(d) + '</div>').join('') + '</td>' +
        '<td><div class="ypl">' + (M ? names(M) : '<span class="muted">—</span>') + '</div></td>' +
        '<td><div class="ypl">' + (T ? names(T) : '<span class="muted">—</span>') + '</div></td>' +
        '<td><div class="ypl">' + (sat && sat.length ? names(sat) : (holidayOf(addDays(m, 5)) && S.settings.sat ? '<span class="hol">Festivo · libran</span> ' + names(satRotation(m)) : '<span class="muted">Cerrado</span>')) + '</div></td>' +
        '<td><button class="btn sm" data-act="goto-week" data-w="' + ymd(m) + '">Ver semana</button></td></tr>';
    }).join('');
    const people = activeStaff().sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const weeks = mondays.length;
    const totals = people.map(p => {
      const t = tot[p.id] || { h: 0, S: 0 };
      return '<tr><td><span class="person">' + avatar(p) + esc(p.name) + '</span></td><td class="num">' + t.S + '</td><td class="num"><strong>' + fmtH(t.h) + '</strong></td><td class="num">' + fmtH(t.h / weeks) + '</td></tr>';
    }).join('');
    return '<div class="stack">' +
      '<div class="weekbar"><div class="weeknav">' +
        '<button class="btn round" data-act="year-prev" aria-label="Año anterior">‹</button>' +
        '<span class="range">Año ' + year + '</span>' +
        '<button class="btn round" data-act="year-next" aria-label="Año siguiente">›</button>' +
        '<span class="pill ok">' + weeks + ' semanas</span>' +
      '</div></div>' +
      '<div class="cols">' +
        '<section class="panel"><div class="panel-h"><h2>Turnos por semana</h2><span class="muted" style="font-size:.85rem">Mañana ' + range('M') + ' · tarde ' + range('T') + ' · sábado ' + satRange() + '</span></div>' +
          '<div class="tablewrap"><table class="year"><thead><tr><th>Sem.</th><th>Fechas</th><th>Mañana</th><th>Tarde</th><th>Sábado</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '</section>' +
        '<section class="panel"><h2>Total del año</h2><div class="tablewrap"><table><thead><tr><th>Persona</th><th class="num">Sáb.</th><th class="num">Horas</th><th class="num">Media/sem.</th></tr></thead><tbody>' + totals + '</tbody></table></div>' +
          '<p class="note">Horas de cuadrante, sin extras, vacaciones ni guardias. Los festivos no están marcados todavía.</p>' +
        '</section>' +
      '</div></div>';
  }

  function renderHolidays() {
    const list = Object.keys(S.holidays || {}).sort().filter(k => k >= ymd(addDays(new Date(), -1)));
    return '<section class="panel"><h2>Festivos</h2><p class="note">La farmacia cierra estos días. Al añadir o quitar uno se rehace esa semana.</p>' +
      '<div>' + (list.map(k => '<div class="holrow"><span><strong class="nowrap">' + DAYS[parse(k).getDay()].slice(0, 3) + ' ' + shortDate(parse(k)) + ' ' + k.slice(0, 4) + '</strong> · ' + esc(S.holidays[k]) + '</span>' +
        '<button class="iconbtn" data-act="hol-del" data-d="' + k + '" aria-label="Quitar festivo">×</button></div>').join('') || '<p class="note">No hay festivos.</p>') + '</div>' +
      '<form class="grid" id="hol-form"><div class="field"><label for="hol-date">Fecha</label><input type="date" id="hol-date" required></div>' +
      '<div class="field"><label for="hol-name">Nombre</label><input id="hol-name" placeholder="Fiesta local"></div>' +
      '<button class="btn primary" type="submit">Añadir festivo</button></form></section>';
  }
  function refreshWeekOf(key) {
    const m = mondayOf(parse(key));
    if (ymd(addDays(m, 6)) < todayKey()) return;
    for (let i = 0; i < 7; i++) { const k = ymd(addDays(m, i)); if (k >= todayKey()) delete S.schedule[k]; }
    // la rotación de sábados posterior también cambia
    Object.keys(S.schedule).forEach(k => { if (k > key && keySat(k)) delete S.schedule[k]; });
    generateWeek(m);
  }

  // ---------- Render: ajustes ----------
  function renderAjustes() {
    const openOpts = [];
    for (let m = 6 * 60; m <= 11 * 60; m += 30) openOpts.push(hm(m));
    const order = [1, 2, 3, 4, 5, 6, 0];
    const reset = ui.confirm === 'reset'
      ? '<span class="muted" style="font-size:.85rem">Se borrarán el equipo y los cuadrantes.</span><button class="btn danger solid sm" data-act="reset-yes">Sí, restaurar</button><button class="btn sm" data-act="cancel">Cancelar</button>'
      : '<button class="btn danger" data-act="reset">Restaurar equipo inicial</button>';
    return '<div class="cols">' +
      '<div class="stack">' +
        '<section class="panel"><h2>Horario de apertura</h2>' +
          '<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">' +
            '<div class="field"><label for="set-mstart">Entrada del turno de mañana</label><select id="set-mstart" data-act="set-mstart">' +
              openOpts.map(o => '<option' + (o === (S.settings.mStart || S.settings.open) ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
            '<div class="field"><label for="set-tstart">Entrada del turno de tarde</label><select id="set-tstart" data-act="set-tstart">' +
              ['13:30', '14:00', '14:30', '15:00', '15:30'].map(o => '<option' + (o === hm(tStartMin()) ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
            '<div class="field"><label for="set-open">Cambio de turno a las 6 h de</label><select id="set-open" data-act="set-open">' +
              openOpts.map(o => '<option' + (o === S.settings.open ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
          '</div>' +
          '<p class="note">Mañana <span class="mono">' + range('M') + '</span> · Tarde <span class="mono">' + range('T') + '</span></p>' +
          '<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">' +
            SHIFTS.map(sh => '<div class="field"><label for="set-min-' + sh + '">Personas de ' + SH_LABEL[sh].toLowerCase() + '</label><select id="set-min-' + sh + '" data-act="set-min" data-sh="' + sh + '">' +
              [1, 2, 3, 4, 5].map(n => '<option' + (n === need(sh) ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>').join('') +
          '</div>' +
          '<p class="note">Cuando contratéis a la sexta persona para la temporada alta, sube la tarde a 3 y pulsa «Generar cuadrante».</p>' +
          '<h3 style="font-family:var(--f-display)">Sábados</h3>' +
          '<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">' +
            '<div class="field"><label for="set-sat-close">Cierre del sábado</label><select id="set-sat-close" data-act="set-sat-close">' +
              ['12:00', '13:00', '13:30', '14:00', '14:30', '15:00'].map(o => '<option' + (o === S.settings.sat.close ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
            '<div class="field"><label for="set-sat-min">Personas el sábado</label><select id="set-sat-min" data-act="set-sat-min">' +
              [1, 2, 3, 4].map(n => '<option' + (n === S.settings.sat.min ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>' +
          '</div>' +
          '<p class="note">Sábado <span class="mono">' + satRange() + '</span>. Rotan todas las personas por igual y siempre entra al menos una que pueda llevar el sábado (se marca en Equipo).</p>' +
          '<div class="field"><label>Días de apertura</label><div class="daychecks">' +
            order.map(d => '<label><input type="checkbox" data-act="set-day" value="' + d + '"' + (S.settings.days.includes(d) ? ' checked' : '') + '> ' + DAYS[d] + '</label>').join('') +
          '</div></div>' +
          '<p class="note">Los cambios de horario se aplican al generar de nuevo el cuadrante.</p>' +
        '</section>' +
        '<section class="panel"><h2>Copia de seguridad</h2>' +
          '<p class="note">Los datos se guardan en este navegador. Copia este texto para guardarlo o pasarlo a otro ordenador, y pégalo aquí para recuperarlo.</p>' +
          '<div class="field"><label for="data-box">Datos de la farmacia</label><textarea id="data-box" spellcheck="false">' + esc(JSON.stringify(S)) + '</textarea></div>' +
          '<div class="actions"><button class="btn" data-act="copy">Copiar datos</button><button class="btn" data-act="import">Cargar datos pegados</button></div>' +
        '</section>' +
      '</div>' +
      '<div class="stack">' + renderHolidays() +
      '<section class="panel"><h2>Empezar de cero</h2><p class="note">Vuelve al equipo inicial: Ramiro (adjunto), Lucía (técnico, responsable) y Anastasia, Aizane y Lorena (auxiliares).</p><div class="actions">' + reset + '</div></section>' +
      '</div>' +
    '</div>';
  }

  // ---------- Render principal ----------
  function render() {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
    if (!weekHasData(mondayOf(new Date()))) generateWeek(mondayOf(new Date()));
    renderNow();
    const views = { cuadrante: renderCuadrante, equipo: renderEquipo, anual: renderAnual, ajustes: renderAjustes };
    document.getElementById('main').innerHTML = (views[ui.tab] || renderCuadrante)();
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }

  // ---------- Acciones ----------
  function canRemove(p) {
    if (p.role === 'titular') return 'La titular no se puede dar de baja.';
    if (p.role === 'adjunto' && activeStaff().filter(x => x.role === 'adjunto').length <= 1)
      return 'Siempre tiene que haber al menos un farmacéutico adjunto. Da de alta a otro antes de esta baja.';
    return null;
  }

  function doBaja(id) {
    const p = byId(id);
    p.active = false; p.until = todayKey();
    const today = todayKey();
    Object.keys(S.schedule).forEach(k => {
      if (k < today) return;
      SHIFTS.forEach(sh => { S.schedule[k][sh] = (S.schedule[k][sh] || []).filter(a => a.id !== id); });
    });
    // Rellena los turnos que quedan cortos a partir de hoy.
    const weeks = new Set(Object.keys(S.schedule).filter(k => k >= today).map(k => ymd(mondayOf(parse(k)))));
    weeks.forEach(w => generateWeek(parse(w)));
    save();
    toast(p.name + ' dada/o de baja. Turnos pendientes reasignados.');
  }

  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      ui.tab = tab.dataset.tab; ui.confirm = null; ui.editing = null;
      try { localStorage.setItem(KEY + ':tab', ui.tab); } catch (err) {}
      render(); return;
    }
    const el = e.target.closest('button[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'prev': ui.week = addDays(ui.week, -7); ui.confirm = null; break;
      case 'next': ui.week = addDays(ui.week, 7); ui.confirm = null; break;
      case 'thisweek': ui.week = mondayOf(new Date()); break;
      case 'goto-week': ui.week = parse(el.dataset.w); ui.tab = 'cuadrante'; window.scrollTo(0, 0); break;
      case 'year-prev': ui.year--; break;
      case 'year-next': ui.year++; break;
      case 'regen': ui.confirm = 'regen'; break;
      case 'regen-yes': generateWeek(ui.week); ui.confirm = null; toast('Cuadrante generado para la semana.'); break;
      case 'cancel': ui.confirm = null; ui.editing = null; break;
      case 'rm': {
        const day = S.schedule[el.dataset.key];
        day[el.dataset.sh] = day[el.dataset.sh].filter(a => a.id !== id);
        save(); break;
      }
      case 'baja': {
        const why = canRemove(byId(id));
        if (why) { toast(why); return; }
        ui.confirm = 'baja:' + id; break;
      }
      case 'baja-yes': ui.confirm = null; doBaja(id); break;
      case 'alta-again': {
        const p = byId(id);
        p.active = true; p.until = null; p.since = todayKey();
        save(); toast(p.name + ' vuelve a estar de alta. Pulsa «Generar cuadrante» para incluirla/o.'); break;
      }
      case 'edit': ui.editing = id; ui.confirm = null; break;
      case 'ed-save': {
        const p = byId(id);
        const name = document.getElementById('ed-name').value.trim();
        const role = document.getElementById('ed-role').value;
        if (!name) { toast('Escribe un nombre.'); return; }
        if (p.role === 'adjunto' && role !== 'adjunto' && activeStaff().filter(x => x.role === 'adjunto').length <= 1) {
          toast('Es el único farmacéutico adjunto: no puede cambiar de rol.'); return;
        }
        if (role === 'titular' && p.role !== 'titular' && S.staff.some(x => x.active && x.role === 'titular')) {
          toast('Ya hay una persona titular.'); return;
        }
        if (p.role === 'titular' && role !== 'titular') { toast('La titular no puede cambiar de rol.'); return; }
        p.name = name; p.role = role; p.shift = document.getElementById('ed-shift').value; p.lead = document.getElementById('ed-lead').checked; p.senior = document.getElementById('ed-senior').checked; const avSel = document.querySelector('input[name="ed-av"]:checked'); if (avSel) p.avatar = avSel.value;
        ui.editing = null; save(); toast('Datos actualizados.'); break;
      }
      case 'reset': ui.confirm = 'reset'; break;
      case 'hol-del': delete S.holidays[el.dataset.d]; refreshWeekOf(el.dataset.d); save(); toast('Festivo quitado.'); break;
      case 'reset-yes': S = seed(); ui.confirm = null; save(); toast('Equipo inicial restaurado.'); break;
      case 'copy': {
        const box = document.getElementById('data-box');
        const fallback = () => { box.focus(); box.select(); toast('Texto seleccionado: cópialo con Ctrl+C.'); };
        try { navigator.clipboard.writeText(box.value).then(() => toast('Datos copiados.'), fallback); } catch (err) { fallback(); }
        return;
      }
      case 'import': {
        try {
          const d = JSON.parse(document.getElementById('data-box').value);
          if (!Array.isArray(d.staff) || !d.settings) throw new Error('formato');
          d.schedule = d.schedule || {};
          S = d; save(); toast('Datos cargados.');
        } catch (err) { toast('El texto pegado no son datos válidos de la aplicación.'); return; }
        break;
      }
      default: return;
    }
    render();
  });

  document.addEventListener('change', e => {
    const el = e.target;
    const act = el.dataset.act;
    if (!act) return;
    if (act === 'resp') {
      const a = S.schedule[el.dataset.key][el.dataset.sh].find(x => x.id === el.dataset.id);
      a.resp = el.value;
    } else if (act === 'add') {
      if (!el.value) return;
      const p = byId(el.value);
      const day = S.schedule[el.dataset.key] || (S.schedule[el.dataset.key] = { M: [], T: [] });
      const list = day[el.dataset.sh];
      const hasCounter = list.some(x => x.resp === 'mostrador');
      list.push({ id: p.id, resp: p.role === 'estudiante' ? 'practicas' : hasCounter && !isPharm(p) ? 'mostrador' : (isPharm(p) && list.some(x => isPharm(byId(x.id))) ? 'gestion' : 'mostrador') });
    } else if (act === 'set-sat-close') {
      S.settings.sat.close = el.value;
    } else if (act === 'set-sat-min') {
      S.settings.sat.min = Number(el.value);
    } else if (act === 'set-min') {
      S.settings.min = Object.assign({ M: 3, T: 3 }, S.settings.min, { [el.dataset.sh]: Number(el.value) });
    } else if (act === 'set-tstart') {
      S.settings.tStart = el.value;
    } else if (act === 'set-mstart') {
      S.settings.mStart = el.value;
    } else if (act === 'set-open') {
      S.settings.open = el.value;
    } else if (act === 'set-day') {
      const v = Number(el.value);
      S.settings.days = el.checked ? S.settings.days.concat(v) : S.settings.days.filter(x => x !== v);
    } else return;
    save(); render();
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'hol-form') {
      const d = document.getElementById('hol-date').value;
      if (!d) { toast('Elige una fecha.'); return; }
      S.holidays = S.holidays || {};
      S.holidays[d] = document.getElementById('hol-name').value.trim() || 'Festivo';
      refreshWeekOf(d); save(); render();
      toast('Festivo añadido: ' + longDate(parse(d)).toLowerCase() + '.');
      return;
    }
    if (e.target.id === 'alta-form') {
      const name = document.getElementById('alta-name').value.trim();
      const role = document.getElementById('alta-role').value;
      if (!name) { toast('Escribe el nombre de la persona.'); return; }
      if (role === 'titular' && S.staff.some(p => p.active && p.role === 'titular')) { toast('Ya hay una persona titular en la farmacia.'); return; }
      S.staff.push({ id: uid(), name, role, shift: document.getElementById('alta-shift').value, lead: document.getElementById('alta-lead').checked, senior: document.getElementById('alta-senior').checked, avatar: (document.querySelector('input[name="alta-av"]:checked') || {}).value || 'droide', active: true, since: todayKey(), until: null });
      save(); render();
      toast(name + ' dada/o de alta como ' + ROLES[role].label.toLowerCase() + '. Pulsa «Generar cuadrante» para incluirla/o.');
    }
  });

  render();
  setInterval(renderNow, 60000);
})();
</script>
