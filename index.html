<!doctype html><!--wrap-->
<html lang="es"><!--wrap-->
<head><!--wrap-->
<meta charset="utf-8"><!--wrap-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--wrap-->
<title>Farmacia Carlos Casado Buigues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Farmacia CB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#154f69">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">
<style>
/* Layout: cabecera en azul petróleo de la marca con el anagrama Cb y quién está trabajando ahora;
   debajo, pestañas y cuadrícula de días que se apila en móvil. Motivo de marca: cuadrado + línea turquesa. */
:root {
  --bg: #edf2f4;
  --surface: #ffffff;
  --surface-2: #f4f7f8;
  --fg: #17303b;
  --muted: #5d747e;
  --line: #d6e0e4;
  --brand: #154f69;
  --brand-2: #496574;
  --sage: #87a4ad;
  --accent: #50c4ca;
  --accent-ink: #0e7a82;
  --accent-soft: #daf2f3;
  --on-brand: #ffffff;
  --on-brand-muted: rgb(255 255 255 / 0.72);
  --brand-glass: rgb(255 255 255 / 0.08);
  --brand-line: rgb(255 255 255 / 0.18);
  --r-tit: #5b47a0;   --r-tit-soft: #ece8f7;
  --r-adj: #154f69;   --r-adj-soft: #dbe8ee;
  --r-tec: #0e7a82;   --r-tec-soft: #daf2f3;
  --r-aux: #496574;   --r-aux-soft: #e3eaed;
  --r-est: #a3600a;   --r-est-soft: #fbecd4;
  --sh-m: #f3f8f9;
  --sh-t: #eef3f6;
  --ok: #17794a;      --ok-soft: #dbf1e5;
  --warn: #965600;    --warn-soft: #fbedd5;
  --err: #b3261e;     --err-soft: #f9dfdc;
  --shadow: 0 1px 2px rgb(21 79 105 / 0.06), 0 8px 24px rgb(21 79 105 / 0.06);
  --f-display: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-body: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a161c; --surface: #102029; --surface-2: #142832; --fg: #dbe8ec; --muted: #8ea6b0; --line: #22404c;
    --brand: #0d3447; --brand-2: #1a4558; --sage: #6c8a94; --accent: #5fd0d6; --accent-ink: #72d9de; --accent-soft: #12363f;
    --r-tit: #b9a6ee; --r-tit-soft: #2a2446; --r-adj: #8cc3dc; --r-adj-soft: #15344a;
    --r-tec: #72d9de; --r-tec-soft: #12363f; --r-aux: #a9bfc8; --r-aux-soft: #1c303a; --r-est: #e9ad57; --r-est-soft: #3a2a12;
    --sh-m: #12262f; --sh-t: #132330;
    --ok: #5fd39a; --ok-soft: #143826; --warn: #e9ad57; --warn-soft: #3a2a12; --err: #f28b82; --err-soft: #43201d;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a161c; --surface: #102029; --surface-2: #142832; --fg: #dbe8ec; --muted: #8ea6b0; --line: #22404c;
  --brand: #0d3447; --brand-2: #1a4558; --sage: #6c8a94; --accent: #5fd0d6; --accent-ink: #72d9de; --accent-soft: #12363f;
  --r-tit: #b9a6ee; --r-tit-soft: #2a2446; --r-adj: #8cc3dc; --r-adj-soft: #15344a;
  --r-tec: #72d9de; --r-tec-soft: #12363f; --r-aux: #a9bfc8; --r-aux-soft: #1c303a; --r-est: #e9ad57; --r-est-soft: #3a2a12;
  --sh-m: #12262f; --sh-t: #132330;
  --ok: #5fd39a; --ok-soft: #143826; --warn: #e9ad57; --warn-soft: #3a2a12; --err: #f28b82; --err-soft: #43201d;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.35rem, 3vw, 1.9rem); font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; }
h2 { font-size: 1.2rem; font-weight: 700; display: inline-flex; flex-direction: column; gap: 4px; }
h2::after { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--accent); }
h3 { font-size: 1rem; font-weight: 700; }
.mono { font-variant-numeric: tabular-nums; font-size: 0.9em; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabecera */
.hero { background: var(--brand); color: var(--on-brand); position: relative; overflow: hidden; }
.hero::before, .hero::after { content: ""; position: absolute; border: 22px solid rgb(255 255 255 / 0.04); pointer-events: none; }
.hero::before { width: 360px; height: 360px; right: -90px; top: -120px; }
.hero::after { width: 180px; height: 180px; right: 220px; bottom: -110px; border-width: 12px; border-color: rgb(80 196 202 / 0.10); }
.hero .wrap { padding-block: 20px 24px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { width: 58px; height: 58px; flex: none; color: var(--on-brand); }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--on-brand-muted); font-size: 0.92rem; }
.brand p.sync { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.03em; padding: 1px 10px; border-radius: 4px; background: var(--brand-glass); border: 1px solid var(--brand-line); color: var(--on-brand); }
.brand p.sync[hidden] { display: none; }
.hdr-logout { display: inline-flex; align-items: center; margin: 6px 0 0 8px; padding: 2px 12px; border-radius: 4px; border: 1px solid var(--brand-line); background: transparent; color: var(--on-brand); font: 600 0.82rem/1.4 var(--f-body); cursor: pointer; }
.hdr-logout:hover { background: var(--brand-glass); border-color: var(--accent); }
.hdr-logout[hidden] { display: none; }
.brand p.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.brand p.sync[data-state="ro"]::before { background: var(--sage); }
.brand p.sync[data-state="saving"]::before { background: #f2c14e; }
.brand p.sync[data-state="error"]::before { background: #f28b82; }

.tabs { display: flex; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: var(--brand-glass); border: 1px solid var(--brand-line); padding: 3px; border-radius: 6px; }
.tabs button { border: 0; background: transparent; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-weight: 600; color: var(--on-brand-muted); letter-spacing: 0.02em; }
.tabs button:hover { color: var(--on-brand); }
.tabs button[aria-selected="true"] { background: var(--on-brand); color: var(--brand); }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--accent); color: #062126; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-selected="true"] { background: var(--accent); color: #062126; } }
.tabs button { white-space: nowrap; flex: none; }
@media (max-width: 560px) { .tabs { width: 100%; } .tabs button { padding-inline: 10px; font-size: 0.92rem; } }

/* Ahora */
.now { background: var(--brand-glass); border: 1px solid var(--brand-line); border-radius: var(--radius); padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px 24px; align-items: center; }
.now .label { font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-brand-muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgb(80 196 202 / 0.25); }
@media (prefers-reduced-motion: no-preference) { .live { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgb(80 196 202 / 0.05); } } }
.now .state { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.now .state .mono { white-space: nowrap; color: var(--on-brand-muted); font-weight: 400; }
.now .people { display: flex; flex-wrap: wrap; gap: 10px; }
.now .soft { color: var(--on-brand-muted); }
.who { display: inline-flex; align-items: center; gap: 10px; padding: 5px 16px 5px 5px; border-radius: 8px; background: var(--brand-glass); border: 1px solid var(--brand-line); }
.who .av { width: 42px; height: 42px; }
.who-t { display: flex; flex-direction: column; line-height: 1.15; }
.who-t strong { font-size: 1rem; font-weight: 600; }
.who-t small { color: var(--on-brand-muted); font-size: 0.82rem; }
@media (max-width: 640px) { .now { grid-template-columns: 1fr; } }

/* Roles y avatares */
.role-titular { --c: var(--r-tit); --cs: var(--r-tit-soft); }
.role-adjunto { --c: var(--r-adj); --cs: var(--r-adj-soft); }
.role-tecnico { --c: var(--r-tec); --cs: var(--r-tec-soft); }
.role-auxiliar { --c: var(--r-aux); --cs: var(--r-aux-soft); }
.role-estudiante { --c: var(--r-est); --cs: var(--r-est-soft); }
.av { width: 34px; height: 34px; border-radius: 30%; overflow: hidden; flex: none; display: inline-block; background: var(--sage); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.av svg, .av img { width: 100%; height: 100%; display: block; object-fit: cover; }
.who .av { box-shadow: 0 0 0 2px var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); }
.badge { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 8px; border-radius: 4px; background: var(--cs); color: var(--c); white-space: nowrap; }
.badge.lead { background: var(--accent-soft); color: var(--accent-ink); }

/* Contenido */
.app { padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.btn:hover { border-color: var(--brand-2); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.danger { color: var(--err); }
.btn.danger:hover { border-color: var(--err); }
.btn.danger.solid { background: var(--err); color: var(--surface); border-color: var(--err); }
.btn.sm { padding: 4px 12px; font-size: 0.88rem; }
.btn.round { width: 38px; height: 38px; padding: 0; font-size: 1.2rem; line-height: 1; }
.iconbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 26px; height: 26px; border-radius: 5px; font-size: 1.1rem; line-height: 1; }
.iconbtn:hover { background: var(--err-soft); color: var(--err); }

.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.weeknav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weeknav .range { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; min-width: 12ch; text-align: center; color: var(--brand); }
:root[data-theme="dark"] .weeknav .range { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .weeknav .range { color: var(--fg); } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Cuadrícula semanal */
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.day > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }
.day .dname { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--brand); }
:root[data-theme="dark"] .day .dname { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .day .dname { color: var(--fg); } }
.day .ddate { color: var(--muted); font-size: 0.95rem; margin-left: 6px; }
.day .todaytag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #062126; background: var(--accent); padding: 1px 9px; border-radius: 4px; }
.day.closed { background: var(--surface-2); box-shadow: none; }
.closedmsg { padding: 2px 16px 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
.shift { margin: 0 8px 8px; padding: 10px 10px 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
.shift.sh-M { background: var(--sh-m); }
.shift.sh-T { background: var(--sh-t); }
.shift-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.shift-h strong { font-family: var(--f-display); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand-2); }
:root[data-theme="dark"] .shift-h strong { color: var(--sage); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shift-h strong { color: var(--sage); } }
.shift-h .mono { color: var(--muted); margin-left: 8px; }
.shift ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pp .av { width: 38px; height: 38px; }
.pp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 9px; padding: 5px 4px 5px 5px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.pp .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.pp .nm .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 0.98rem; }
.pp .nm .r { font-size: 0.76rem; color: var(--c); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp.gone { opacity: 0.55; }
.pp.gone .n { text-decoration: line-through; }
select.resp { border: 0; border-radius: 4px; padding: 3px 6px; font-size: 0.82rem; font-weight: 600; width: 108px; cursor: pointer; background: var(--accent-soft); color: var(--accent-ink); }
select.resp[data-resp="admin"] { background: var(--r-aux-soft); color: var(--r-aux); }
select.resp[data-resp="gestion"] { background: var(--r-tit-soft); color: var(--r-tit); }
select.resp[data-resp="practicas"] { background: var(--r-est-soft); color: var(--r-est); }
select.add { border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 5px 10px; font-size: 0.9rem; color: var(--muted); width: 100%; cursor: pointer; }
select.add:hover { border-color: var(--accent); color: var(--accent-ink); }
.issues { display: flex; flex-wrap: wrap; gap: 4px; }
.issue { font-size: 0.8rem; font-weight: 600; padding: 1px 9px; border-radius: 4px; }
.issue.err { background: var(--err-soft); color: var(--err); }
.issue.warn { background: var(--warn-soft); color: var(--warn); }
.issue.info { background: var(--surface); color: var(--muted); }

/* Paneles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
th { text-align: left; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td .rowact { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.person { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.person .av { width: 38px; height: 38px; }
.pcap { display: flex; flex-direction: column; line-height: 1.15; }
.pcap small { font-weight: 400; font-size: 0.8rem; color: var(--muted); }

form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.field input, .field select, .field textarea, td input, td select { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 10px; width: 100%; min-width: 0; }
.field input:focus, .field select:focus { border-color: var(--accent); }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; min-height: 140px; resize: vertical; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; font-weight: 600; padding-bottom: 8px; white-space: nowrap; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
.checks .mark { flex: none; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; }
.checks .mark.ok { background: var(--ok-soft); color: var(--ok); }
.checks .mark.err { background: var(--err-soft); color: var(--err); }

.daychecks { display: flex; flex-wrap: wrap; gap: 6px; }
.daychecks label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font-size: 0.92rem; }
.note { font-size: 0.9rem; color: var(--muted); margin: 0; max-width: 70ch; }
.banner { padding: 12px 16px; border-radius: 6px; font-size: 0.95rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }

/* Año */
.ypl { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.yp { display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
.yp .av { width: 24px; height: 24px; box-shadow: none; }
table.year td { padding-block: 6px; }
tr.nowrow td { background: var(--accent-soft); }
.nowrap { white-space: nowrap; }
body.locked .tabs, body.locked #now, body.locked #main, body.locked #subtitle { display: none; }
.login { padding: 32px max(16px, env(safe-area-inset-left, 0px)) 48px; display: flex; justify-content: center; }
.loginbox { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.loginbox .logo { width: 52px; height: 52px; color: var(--brand); }
:root[data-theme="dark"] .loginbox .logo { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .loginbox .logo { color: var(--fg); } }

<script id="app-main">
(function () {
  'use strict';

  // ---------- Constantes ----------
  const KEY = 'farmacia-ccb-turnos-v2';
  const ROLES = {
    titular:    { label: 'Farmacéutica/o titular',   short: 'Titular',   abbr: 'TIT', pharm: true,  order: 1 },
    adjunto:    { label: 'Farmacéutica/o adjunta/o', short: 'Adjunto',   abbr: 'ADJ', pharm: true,  order: 0 },
    tecnico:    { label: 'Técnico en farmacia',      short: 'Técnico',   abbr: 'TÉC', pharm: false, order: 2 },
    auxiliar:   { label: 'Auxiliar de farmacia',     short: 'Auxiliar',  abbr: 'AUX', pharm: false, order: 2 },
    estudiante: { label: 'Estudiante en prácticas',  short: 'Prácticas', abbr: 'PRÁ', pharm: false, order: 3 }
  };
  const RESP = {
    mostrador: 'Mostrador',
    admin: 'Administración',
    gestion: 'Gestión',
    practicas: 'Prácticas tutorizadas'
  };
  const RESP_SHORT = { mostrador: 'Mostrador', admin: 'Administrac.', gestion: 'Gestión', practicas: 'Prácticas' };
  const SHIFTS = ['M', 'T'];
  const SH_LABEL = { M: 'Mañana', T: 'Tarde' };
  const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const need = sh => (S.settings.min && S.settings.min[sh]) || 3;

  // ---------- Utilidades de fecha ----------
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
  const todayKey = () => ymd(new Date());
  const shortDate = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
  const longDate = d => DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  const weekIndex = monday => Math.floor(Math.round(monday.getTime() / 864e5 + 3) / 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---------- Datos ----------
  function seed() {
    const today = new Date();
    const since = ymd(addDays(today, -400));
    const staff = [
      { id: 's2', name: 'Ramiro González', role: 'adjunto',  shift: altCode('M') },
      { id: 's3', name: 'Lucía Rojo',      role: 'tecnico',  shift: altCode('T'), lead: true },
      { id: 's4', name: 'Anastasia',       role: 'auxiliar', shift: 'M', senior: true },
      { id: 's5', name: 'Aizane',          role: 'auxiliar', shift: 'M' },
      { id: 's6', name: 'Lorena',          role: 'auxiliar', shift: 'T' }
    ].map(p => Object.assign(p, { active: true, since: since, until: null }));
    return { version: 8, settings: { open: '09:00', mStart: '08:30', tStart: '14:30', days: [1, 2, 3, 4, 5, 6], min: { M: 3, T: 2 }, sat: { close: '14:00', min: 2 } }, staff, schedule: {} };
  }

  let S = null;
  // En claude.ai el cuadrante va dentro de la propia página (bloque «estado»): cualquiera con el
  // enlace lo ve sin cuenta, y quien puede editar lo vuelve a publicar con sus cambios.
  // Abierto como archivo suelto, funciona en local con los datos del navegador.
  const SYNC_ON = !!(window.claude && typeof window.claude.use === 'function');
  // Web pública (GitHub Pages): el cuadrante está en «datos.json»; la propietaria publica con su clave de GitHub.
  const WEB = !SYNC_ON && /^https?:$/.test(location.protocol);
  const GH_REPO = (() => {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return m && seg ? m[1] + '/' + seg : 'farmacasadobuigues-cpu/Horarios-Farmacia';
  })();
  const GH_BRANCH = 'main';
  const sync = { canEdit: !SYNC_ON && !WEB, artifact: null, dirty: false, publishing: false };
  let EMB = null;
  try { EMB = JSON.parse(document.getElementById('estado').textContent); } catch (e) { EMB = null; }
  // Fuente de la página tal como se publicó (para volver a publicarla con el estado nuevo).
  const PAGE_SOURCE = (() => {
    const html = document.body.innerHTML;
    const start = html.indexOf('<title>');
    const mainAt = html.indexOf('id="app-main"');
    const end = mainAt < 0 ? -1 : html.indexOf('</' + 'script>', mainAt);
    const hero = html.indexOf('class="hero"');
    const ok = start >= 0 && end > 0 && hero > start && hero < mainAt && html.indexOf('id="estado"') > hero;
    return ok ? html.slice(start, end + 9) : null;
  })();
  const PAGE_RESET = (() => { const st = document.head && document.head.querySelector('style'); return st ? st.textContent : ''; })();
  if (EMB && Array.isArray(EMB.staff)) S = JSON.parse(JSON.stringify(EMB));
  else if (!SYNC_ON && !WEB) { try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; } }
  if (!S || !Array.isArray(S.staff)) S = seed();
  let openYearView = false;
  function migrate() {
  if (!S.version || S.version < 3) {
    // Lucía Rojo pasa a técnico; las tardes se cubren con 2 personas hasta la temporada alta.
    const lucia = S.staff.find(p => p.name === 'Lucía Rojo' && p.role === 'adjunto');
    if (lucia) {
      lucia.role = 'tecnico';
      const ramiro = S.staff.find(p => p.active && p.role === 'adjunto');
      Object.keys(S.schedule).forEach(k => { S.schedule[k].T && S.schedule[k].T.forEach(a => { if (a.id === lucia.id && a.resp === 'gestion') a.resp = 'mostrador'; }); });
    }
    S.settings.min = S.settings.min || { M: 3, T: 2 };
    S.version = 3;
  }
  if (S.version < 4) {
    // Ramiro alterna mañana/tarde cada día y Lucía, responsable de turno, hace el turno contrario.
    const ramiro = S.staff.find(p => p.name === 'Ramiro González');
    const lucia = S.staff.find(p => p.name === 'Lucía Rojo');
    if (lucia) lucia.lead = true;
    const t = ymd(new Date());
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 4;
  }
  if (S.version < 5) {
    // Turnos por semanas completas: Ramiro y Lucía alternan semana a semana, uno de mañana y otra de tarde.
    // Las guardias se gestionan fuera de la aplicación.
    S.staff.forEach(p => { if (p.shift === 'X' || p.shift === 'DM') p.shift = altCode('M'); else if (p.shift === 'DT') p.shift = altCode('T'); });
    delete S.guards;
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 5;
  }
  if (S.version < 6) {
    // Sábados de 9:00 a 14:00 con 2 personas en rotación; Anastasia puede llevar el sábado.
    S.settings.sat = S.settings.sat || { close: '14:00', min: 2 };
    const ana = S.staff.find(p => p.name === 'Anastasia');
    if (ana) ana.senior = true;
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 6;
  }
  if (S.version < 7) {
    // El turno de mañana entra a las 8:30 de lunes a viernes.
    S.settings.mStart = '08:30';
    S.version = 7;
  }
  if (S.version < 8) {
    // La tarde entra a las 14:30: media hora de solape con la mañana.
    S.settings.tStart = '14:30';
    S.version = 8;
  }
  if (S.version < 9) {
    // Turnos de 2027 tomados del Excel «HORARIO 2027 turnos v2» (Drive):
    // Ramiro y Luci alternan por semanas (Ramiro empieza de mañana el 4-ene-2027),
    // Lorena y Aizane siempre de mañana, Nas (Anastasia) siempre de tarde.
    const find = n => S.staff.find(p => p.name.split(' ')[0] === n);
    const ramiro = find('Ramiro'), lucia = find('Lucía'), lorena = find('Lorena'), aizane = find('Aizane'), nas = find('Anastasia');
    S.weekPlan = S.weekPlan || {};
    const start = new Date(2027, 0, 4);
    for (let w = 0; w < 54; w++) {
      const plan = {};
      if (ramiro) plan[ramiro.id] = w % 2 ? 'T' : 'M';
      if (lucia) plan[lucia.id] = w % 2 ? 'M' : 'T';
      if (lorena) plan[lorena.id] = 'M';
      if (aizane) plan[aizane.id] = 'M';
      if (nas) plan[nas.id] = 'T';
      S.weekPlan[ymd(addDays(start, w * 7))] = plan;
    }
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-01-04') delete S.schedule[k]; });
    S.version = 9;
    openYearView = true;
  }
  if (S.version < 10) {
    // Ramiro empieza 2027 de tarde (sigue la rutina de 2026) y Luci de mañana.
    const ramiro = S.staff.find(p => p.name.split(' ')[0] === 'Ramiro');
    const lucia = S.staff.find(p => p.name.split(' ')[0] === 'Lucía');
    Object.keys(S.weekPlan || {}).forEach(k => {
      const plan = S.weekPlan[k];
      if (ramiro && plan[ramiro.id]) plan[ramiro.id] = plan[ramiro.id] === 'M' ? 'T' : 'M';
      if (lucia && plan[lucia.id]) plan[lucia.id] = plan[lucia.id] === 'M' ? 'T' : 'M';
    });
    // Festivos: nacionales + locales (5 de agosto y 22 de octubre). La farmacia cierra esos días.
    S.holidays = Object.assign({
      '2026-12-08': 'Inmaculada Concepción',
      '2026-12-25': 'Navidad',
      '2027-01-01': 'Año Nuevo',
      '2027-01-06': 'Epifanía del Señor',
      '2027-03-26': 'Viernes Santo',
      '2027-05-01': 'Fiesta del Trabajo',
      '2027-08-05': 'Fiesta local',
      '2027-08-15': 'Asunción de la Virgen',
      '2027-10-12': 'Fiesta Nacional de España',
      '2027-10-22': 'Fiesta local',
      '2027-11-01': 'Todos los Santos',
      '2027-12-06': 'Día de la Constitución',
      '2027-12-08': 'Inmaculada Concepción',
      '2027-12-25': 'Navidad'
    }, S.holidays || {});
    const t = ymd(mondayOf(new Date()));
    Object.keys(S.schedule).forEach(k => { if (k >= t) delete S.schedule[k]; });
    S.version = 10;
    openYearView = true;
  }
  if (S.version < 11) {
    // Festivos autonómicos de la Comunitat Valenciana que se repiten cada año.
    S.holidays = S.holidays || {};
    S.holidays['2027-03-29'] = S.holidays['2027-03-29'] || 'Lunes de Pascua (Comunitat Valenciana)';
    S.holidays['2027-10-09'] = S.holidays['2027-10-09'] || 'Día de la Comunitat Valenciana';
    Object.keys(S.schedule).forEach(k => { if (k >= '2027-03-29') delete S.schedule[k]; });
    S.version = 11;
  }
  if (S.version < 12) {
    // Calendario laboral 2027 de la Comunitat Valenciana confirmado por la farmacia:

    let changed = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      const existing = S.schedule[key];
      // No se reescriben días pasados que ya tienen cuadrante.
      if (key < today && existing) {
        SHIFTS.forEach(sh => (existing[sh] || []).forEach(a => { hours[a.id] = (hours[a.id] || 0) + shHours(key, sh); }));
        continue;
      }
      if (!isOpenDay(d)) { delete S.schedule[key]; continue; }
      if (isSat(d)) {
        const list = satRotation(monday);
        list.forEach(p => { hours[p.id] = (hours[p.id] || 0) + shHours(key, 'M'); });
        S.schedule[key] = { M: assignResp(list, i), T: [] };
        changed++;
        continue;
      }
      const day = { M: [], T: [] };
      const used = new Set();
      SHIFTS.forEach(sh => {
        const score = p => {
          const pref = effPref(p, monday);
          return (pref === sh ? 0 : 2000) + (used.has(p.id) ? 10000 : 0) + (hours[p.id] || 0);
        };
        const pick = pool => pool.slice().sort((a, b) => score(a) - score(b) || ROLES[a.role].order - ROLES[b.role].order)[0];
        const list = [];
        // Un responsable por turno (farmacéutico o responsable designado); nadie dobla turno automáticamente.
        const ph = pick(act.filter(p => isLead(p) && !used.has(p.id)));
        if (ph) list.push(ph);
        while (list.length < need(sh)) {
          const c = pick(act.filter(p => p.role !== 'estudiante' && !list.includes(p) && !used.has(p.id)));
          if (!c) break;
          list.push(c);
        }
        act.filter(p => p.role === 'estudiante' && !used.has(p.id) && effPref(p, monday) === sh)
          .forEach(p => list.push(p));
        list.forEach(p => { used.add(p.id); hours[p.id] = (hours[p.id] || 0) + 6; });
        day[sh] = assignResp(list, i + (sh === 'T' ? 1 : 0));
      });
      S.schedule[key] = day;
      changed++;
    }
    save();
    return changed;
  }

  function weekHasData(monday) {
    for (let i = 0; i < 7; i++) if (S.schedule[ymd(addDays(monday, i))]) return true;
    return false;
  }

  // ---------- Validación ----------
  function shiftIssues(key, sh) {
    const day = S.schedule[key];
    const list = (day && day[sh]) || [];
    const out = [];
    const people = list.map(a => byId(a.id)).filter(Boolean);
    const present = people.filter(p => activeOn(p, key));
    const valid = present.filter(p => !onVac(p.id, key));
    const count = valid.filter(p => p.role !== 'estudiante').length;
    const vacNames = present.filter(p => onVac(p.id, key)).map(p => p.name.split(' ')[0]);
    if (vacNames.length) out.push({ lvl: 'warn', t: 'De vacaciones: ' + vacNames.join(', ') });
    if (keySat(key)) { if (!valid.some(canLeadSat)) out.push({ lvl: 'err', t: 'Falta alguien que pueda llevar el sábado' }); }
    else if (!valid.some(isLead)) out.push({ lvl: 'err', t: 'Sin farmacéutico ni responsable' });
    const n = needOn(key, sh);
    if (count < n) out.push({ lvl: 'err', t: 'Falta' + (n - count > 1 ? 'n ' : ' ') + (n - count) + (n - count > 1 ? ' personas' : ' persona') });
    if (count > n) out.push({ lvl: 'info', t: 'Refuerzo: ' + count + ' personas' });
    if (valid.length && !list.some(a => a.resp === 'mostrador' && byId(a.id) && activeOn(byId(a.id), key))) out.push({ lvl: 'warn', t: 'Nadie en mostrador' });
    people.filter(p => !activeOn(p, key)).forEach(p => out.push({ lvl: 'err', t: shortName(p) + ' está de baja' }));
    const other = (day && day[sh === 'M' ? 'T' : 'M']) || [];
    valid.forEach(p => { if (other.some(a => a.id === p.id)) out.push({ lvl: 'warn', t: shortName(p) + ' dobla turno (12 h)' }); });
    return out;
  }

  function weekIssueCount(monday) {
    let err = 0, warn = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      if (!isOpenDay(d) && !S.schedule[key]) continue;
      dayShifts(key).forEach(sh => shiftIssues(key, sh).forEach(x => { if (x.lvl === 'err') err++; else if (x.lvl === 'warn') warn++; }));
    }
    return { err, warn };
  }

  // ---------- Render: estado actual ----------
  function renderNow() {
    if (WEB && !AUTH.dk) return;
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const key = ymd(now);
    let label = 'Ahora · ' + hm(mins), state, people = '';
    const nowShifts = dayShifts(key).filter(sh => { const [a, b] = shTimes(key, sh); return mins >= a && mins < b; });
    const shiftNow = nowShifts[nowShifts.length - 1];
    const day = S.schedule[key];
    if (beforeStart(now)) {
      state = 'Nuevo cuadrante';
      people = '<span class="soft">Empieza el ' + startText() + '.</span>';
    } else if (isOpenDay(now) && shiftNow && day) {
      state = nowShifts.length > 1 ? 'Cambio de turno <span class="mono muted">' + hm(shTimes(key, 'T')[0]) + '–' + hm(shTimes(key, 'M')[1]) + '</span>'
        : (keySat(key) ? 'Sábado' : 'Turno de ' + SH_LABEL[shiftNow].toLowerCase()) + ' <span class="mono muted">' + shRange(key, shiftNow) + '</span>';
      people = [].concat(...nowShifts.map(sh => day[sh] || [])).filter(a => !onVac(a.id, key)).map(a => {
        const p = byId(a.id); if (!p) return '';
        return '<span class="who role-' + p.role + '">' + avatar(p) + '<span class="who-t"><strong>' + esc(p.name) + '</strong><small>' + ROLES[p.role].short + ' · ' + RESP[a.resp] + '</small></span></span>';
      }).join('');
    } else {
      state = 'Cerrado';
      people = '<span class="soft">' + nextOpening(now) + '</span>';
    }
    document.getElementById('now').innerHTML =
      '<div><div class="label"><span class="live"></span>' + label + '</div><div class="state">' + state + '</div></div>' +
      '<div class="people">' + people + '</div>';
    document.getElementById('subtitle').textContent =
      'Abierto ' + hm(times('M')[0]) + '–' + hm(times('T')[1]) + (S.settings.sat && S.settings.days.includes(6) ? ' · sábados ' + satRange() : '') + ' · ' + need('M') + ' personas de mañana y ' + need('T') + ' de tarde';
  }
  function nextOpening(now) {
    const mins = now.getHours() * 60 + now.getMinutes();
    for (let i = 0; i < 8; i++) {
      const d = addDays(now, i);
      if (!isOpenDay(d)) continue;
      if (i === 0 && mins >= times('M')[0]) continue;
      return 'Próxima apertura: ' + (i === 0 ? 'hoy' : i === 1 ? 'mañana' : DAYS[d.getDay()].toLowerCase()) + ' a las ' + hm(times('M')[0]);
    }
    return 'No hay días de apertura configurados';
  }

  // ---------- Render: cuadrante ----------
  function renderCuadrante() {
    const monday = ui.week;
    if (!weekHasData(monday) && ymd(addDays(monday, 6)) >= todayKey()) generateWeek(monday);
    const sunday = addDays(monday, 6);
    const rangeTxt = monday.getMonth() === sunday.getMonth()
      ? monday.getDate() + '–' + sunday.getDate() + ' ' + MONTHS[sunday.getMonth()] + ' ' + sunday.getFullYear()
      : shortDate(monday) + ' – ' + shortDate(sunday) + ' ' + sunday.getFullYear();
    const ic = weekIssueCount(monday);
    const status = ic.err ? '<span class="pill err">' + ic.err + (ic.err > 1 ? ' turnos con problemas' : ' turno con problemas') + '</span>'
      : ic.warn ? '<span class="pill warn">' + ic.warn + (ic.warn > 1 ? ' avisos' : ' aviso') + '</span>'
      : '<span class="pill ok">✓ Todos los turnos cubiertos</span>';
    const regen = ui.confirm === 'regen'
      ? '<span class="muted" style="font-size:.85rem">Se sustituyen los cambios manuales desde hoy.</span><button class="btn primary sm" data-act="regen-yes">Generar</button><button class="btn sm" data-act="cancel">Cancelar</button>'
      : '<button class="btn primary" data-act="regen">Generar cuadrante</button>';

    let html = '<div class="stack">' +
      '<div class="weekbar">' +
        '<div class="weeknav">' +
          '<button class="btn round" data-act="prev" aria-label="Semana anterior">‹</button>' +
          '<span class="range">' + rangeTxt + '</span>' +
          '<button class="btn round" data-act="next" aria-label="Semana siguiente">›</button>' +
          '<button class="btn sm" data-act="thisweek">Esta semana</button>' +
          status +
        '</div>' +
        '<div class="actions">' + regen + '</div>' +
      '</div>' +
      shortBanner() +
      '<div class="legend">' +
        Object.keys(ROLES).filter(r => r === 'estudiante' || activeStaff().some(p => p.role === r)).map(r => '<span class="role-' + r + '"><span class="dot"></span>' + ROLES[r].label + '</span>').join('') +
      '</div>' +
      '<div class="week">';

    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), key = ymd(d);
      const isToday = key === todayKey();
      const gHtml = guardsOn(key).map(g => '<div class="guardline"><strong>' + guardLabel(g) + '</strong><span>' +
        ((g.people || []).map(id => byId(id)).filter(Boolean).map(p => esc(p.name.split(' ')[0])).join(', ') || 'Sin asignar') + ' · ' + guardRange(g) + '</span></div>').join('');
      const head = '<header><span><span class="dname">' + DAYS[d.getDay()] + '</span> <span class="ddate">' + shortDate(d) + '</span></span>' + (isToday ? '<span class="todaytag">Hoy</span>' : '') + '</header>';
      if (!isOpenDay(d) && !S.schedule[key]) {
        html += '<article class="day closed' + (isToday ? ' today' : '') + '">' + head + gHtml + '<div class="closedmsg">' + (holidayOf(d) ? '<span class="pill warn">Festivo</span> ' + esc(holidayOf(d)) +
          (d.getDay() === 6 && S.settings.sat ? '<br>Libran: ' + satRotation(monday).map(p => esc(p.name.split(' ')[0])).join(' y ') : '') : 'Cerrado') + '</div></article>';
        continue;
      }
      html += '<article class="day' + (isToday ? ' today' : '') + '">' + head + gHtml;
      dayShifts(key).forEach(sh => {
        const list = (S.schedule[key] && S.schedule[key][sh]) || [];
        const iss = shiftIssues(key, sh);
        const ok = !iss.some(x => x.lvl === 'err');
        html += '<section class="shift sh-' + sh + '"><div class="shift-h"><span><strong>' + (keySat(key) ? 'Mañana' : SH_LABEL[sh]) + '</strong><span class="mono">' + shRange(key, sh) + '</span></span>' +
          '<span class="pill ' + (ok ? 'ok' : 'err') + '" title="' + (ok ? 'Turno cubierto' : 'Turno incompleto') + '">' + list.filter(a => byId(a.id) && activeOn(byId(a.id), key) && byId(a.id).role !== 'estudiante').length + '/' + needOn(key, sh) + '</span></div><ul>';
        list.forEach(a => {
          const p = byId(a.id); if (!p) return;
          html += '<li class="pp role-' + p.role + (activeOn(p, key) ? '' : ' gone') + (onVac(p.id, key) ? ' vac' : '') + '">' + avatar(p) + '<span class="nm" title="' + esc(p.name + ' · ' + ROLES[p.role].label) + '"><span class="n">' + esc(p.name.trim().split(/\s+/)[0]) + '</span><span class="r">' + (onVac(p.id, key) ? 'De vacaciones' : ROLES[p.role].short + (p.lead && !isPharm(p) ? ' · Resp.' : '')) + '</span></span>' +
            '<select class="resp" data-resp="' + a.resp + '" data-act="resp" data-key="' + key + '" data-sh="' + sh + '" data-id="' + p.id + '" aria-label="Responsabilidad de ' + esc(p.name) + '">' +
            Object.keys(RESP).map(r => '<option value="' + r + '"' + (r === a.resp ? ' selected' : '') + '>' + RESP_SHORT[r] + '</option>').join('') + '</select>' +
            '<button class="iconbtn" data-act="rm" data-key="' + key + '" data-sh="' + sh + '" data-id="' + p.id + '" aria-label="Quitar a ' + esc(p.name) + ' del turno">×</button></li>';
        });
        html += '</ul>';
        if (iss.length) html += '<div class="issues">' + iss.map(x => '<span class="issue ' + x.lvl + '">' + esc(x.t) + '</span>').join('') + '</div>';
        const avail = activeStaff().filter(p => !list.some(a => a.id === p.id));
        if (avail.length) {
          html += '<select class="add" data-act="add" data-key="' + key + '" data-sh="' + sh + '" aria-label="Añadir persona al turno de ' + SH_LABEL[sh].toLowerCase() + '"><option value="">+ Añadir persona…</option>' +
            avail.map(p => '<option value="' + p.id + '">' + esc(p.name) + ' (' + ROLES[p.role].short + ')</option>').join('') + '</select>';
        }
        html += '</section>';
      });
      html += '</article>';
    }
    html += '</div>' + renderWeekSummary(monday) + '</div>';
    return html;
  }

  function shortBanner() {
    const team = activeStaff().filter(p => p.role !== 'estudiante').length;
    if (team >= need('M') + need('T')) return '';
    const miss = need('M') + need('T') - team;
    return '<div class="banner warn"><span>Con ' + team + ' personas no se cubren ' + need('M') + ' por la mañana y ' + need('T') + ' por la tarde sin doblar turno: ' +
      (miss > 1 ? 'faltan ' + miss + ' personas' : 'falta 1 persona') + ' cada día. Da de alta a alguien o añádelo a mano en el turno.</span>' +
      '<button class="btn sm" data-tab="equipo">Ir a Equipo</button></div>';
  }

  function renderWeekSummary(monday) {
    const rows = {};
    for (let i = 0; i < 7; i++) {
      const key = ymd(addDays(monday, i));
      const day = S.schedule[key]; if (!day) continue;
      SHIFTS.forEach(sh => (day[sh] || []).forEach(a => {
        const r = rows[a.id] || (rows[a.id] = { M: 0, T: 0, S: 0, h: 0, mostrador: 0, admin: 0, gestion: 0, practicas: 0 });
        if (onVac(a.id, key)) return; r[keySat(key) ? 'S' : sh]++; r[a.resp]++; r.h += shHours(key, sh);
      }));
    }
    const people = S.staff.filter(p => p.active || rows[p.id])
      .sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    return '<section class="panel"><div class="panel-h"><h2>Resumen de la semana</h2><span class="muted" style="font-size:.85rem">Mañana: ' + fmtH((times('M')[1] - times('M')[0]) / 60) + ' · tarde: ' + fmtH((times('T')[1] - times('T')[0]) / 60) + (S.settings.sat ? ' · sábado: ' + fmtH((toMin(S.settings.sat.close) - openMin()) / 60) : '') + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Persona</th><th>Rol</th><th class="num">Mañanas</th><th class="num">Tardes</th><th class="num">Sábados</th><th class="num">Horas</th><th class="num">Mostrador</th><th class="num">Admin.</th><th class="num">Gestión</th></tr></thead><tbody>' +
      people.map(p => {
        const r = rows[p.id] || { M: 0, T: 0, S: 0, h: 0, mostrador: 0, admin: 0, gestion: 0, practicas: 0 };
        return '<tr><td><span class="person">' + avatar(p) + esc(p.name) + (p.active ? '' : ' <span class="muted">(baja)</span>') + '</span></td><td>' + roleBadge(p) + '</td>' +
          '<td class="num">' + r.M + '</td><td class="num">' + r.T + '</td><td class="num">' + r.S + '</td><td class="num"><strong>' + fmtH(r.h) + '</strong></td>' +
          '<td class="num">' + r.mostrador + '</td><td class="num">' + r.admin + '</td><td class="num">' + r.gestion + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  // ---------- Render: equipo ----------
  function staffChecks() {
    const act = activeStaff();
    const adj = act.filter(p => p.role === 'adjunto').length;
    const team = act.filter(p => p.role !== 'estudiante').length;
    const leads = act.filter(isLead).length;
    const satLeads = act.filter(canLeadSat);
    return [
      { ok: adj >= 1, t: 'Farmacéuticos adjuntos en plantilla: <strong>' + adj + '</strong> (mínimo 1)' },
      { ok: leads >= 2, t: 'Farmacéutico o responsable para mañana y tarde: <strong>' + leads + '</strong> (mínimo 2)' },
      { ok: team >= need('M') + need('T'), t: 'Personas para ' + need('M') + ' de mañana + ' + need('T') + ' de tarde: <strong>' + team + '</strong> (mínimo ' + (need('M') + need('T')) + ')' },
      { ok: satLeads.length >= 1, t: 'Pueden llevar el sábado: <strong>' + (satLeads.map(p => esc(p.name.split(' ')[0])).join(', ') || 'nadie') + '</strong>' },
    ];
  }

  function renderEquipo() {
    const act = activeStaff().sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const gone = S.staff.filter(p => !p.active);
    const monday = mondayOf(new Date());
    const hoursWeek = id => {
      let h = 0;
      for (let i = 0; i < 7; i++) { const day = S.schedule[ymd(addDays(monday, i))]; const k = ymd(addDays(monday, i)); if (day) SHIFTS.forEach(sh => { if ((day[sh] || []).some(a => a.id === id) && !onVac(id, k)) h += shHours(k, sh); }); }
      return h;
    };
    const roleOpts = sel => Object.keys(ROLES).map(r => '<option value="' + r + '"' + (r === sel ? ' selected' : '') + '>' + ROLES[r].label + '</option>').join('');
    const prefOpts = sel => ['M', 'T', altCode('M'), altCode('T')].map(c => '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + prefLabel(c) + '</option>').join('');

    const rows = act.map(p => {
      if (ui.editing === p.id) {
        return '<tr><td><input id="ed-name" value="' + esc(p.name) + '" aria-label="Nombre"></td>' +
          '<td><select id="ed-role" aria-label="Rol">' + roleOpts(p.role) + '</select></td>' +
          '<td><select id="ed-shift" aria-label="Turno habitual">' + prefOpts(p.shift) + '</select></td><td colspan="2"><label class="chk"><input type="checkbox" id="ed-lead"' + (p.lead ? ' checked' : '') + '> Responsable de turno</label><label class="chk"><input type="checkbox" id="ed-senior"' + (p.senior ? ' checked' : '') + '> Puede llevar el sábado</label></td>' +
          '<td><div class="rowact"><button class="btn primary sm" data-act="ed-save" data-id="' + p.id + '">Guardar</button><button class="btn sm" data-act="cancel">Cancelar</button></div></td></tr>' +
          '<tr><td colspan="6"><div class="field"><label>Avatar</label>' + avPicker('ed-av', avKey(p)) + '</div></td></tr>';
      }
      const confirming = ui.confirm === 'baja:' + p.id;
      return '<tr><td><span class="person">' + avatar(p) + '<span class="pcap">' + esc(p.name) + '<small>' + esc(avCaption(p)) + '</small></span></span></td>' +
        '<td>' + roleBadge(p) + (p.lead && !isPharm(p) ? ' <span class="badge lead">Responsable</span>' : '') + (p.senior && !isLead(p) ? ' <span class="badge lead">Lleva sábado</span>' : '') + '</td><td>' + prefLabel(p.shift) + '</td>' +
        '<td class="mono muted">' + shortDate(parse(p.since)) + ' ' + p.since.slice(0, 4) + '</td>' +
        '<td class="num">' + fmtH(hoursWeek(p.id)) + '</td>' +
        '<td><div class="rowact">' + (confirming
          ? '<span class="muted" style="font-size:.85rem">¿Dar de baja?</span><button class="btn danger solid sm" data-act="baja-yes" data-id="' + p.id + '">Sí, dar de baja</button><button class="btn sm" data-act="cancel">No</button>'
          : '<label class="btn sm" title="Sube una imagen para su avatar">Foto<input type="file" accept="image/*" data-act="photo" data-id="' + p.id + '" hidden></label>' +
            (p.photo ? '<button class="btn sm" data-act="photo-del" data-id="' + p.id + '">Quitar foto</button>' : '') +
            '<button class="btn sm" data-act="edit" data-id="' + p.id + '">Editar</button>' + (p.role === 'titular' ? '' : '<button class="btn danger sm" data-act="baja" data-id="' + p.id + '">Dar de baja</button>')) +
        '</div></td></tr>';
    }).join('');

    const goneRows = gone.map(p => '<tr><td><span class="person role-' + p.role + '"><span class="dot"></span>' + esc(p.name) + '</span></td><td>' + roleBadge(p) + '</td>' +
      '<td class="mono muted">' + (p.until ? shortDate(parse(p.until)) + ' ' + p.until.slice(0, 4) : '—') + '</td>' +
      '<td><div class="rowact"><button class="btn sm" data-act="alta-again" data-id="' + p.id + '">Volver a dar de alta</button></div></td></tr>').join('');

    const checks = staffChecks();
    return '<div class="cols">' +
      '<div class="stack">' +
        '<section class="panel"><div class="panel-h"><h2>Dar de alta</h2></div>' +
          '<form class="grid" id="alta-form" autocomplete="off">' +
            '<div class="field"><label for="alta-name">Nombre y apellidos</label><input id="alta-name" required placeholder="Nombre de la persona"></div>' +
            '<div class="field"><label for="alta-role">Rol</label><select id="alta-role">' + roleOpts('auxiliar') + '</select></div>' +
            '<div class="field"><label for="alta-shift">Turno habitual</label><select id="alta-shift">' + prefOpts('M') + '</select></div>' +
            '<label class="chk"><input type="checkbox" id="alta-lead"> Responsable de turno</label>' +
            '<label class="chk"><input type="checkbox" id="alta-senior"> Puede llevar el sábado</label>' +
            '<div class="field" style="grid-column:1/-1"><label>Avatar</label>' + avPicker('alta-av', 'droide') + '</div>' +
            '<button class="btn primary" type="submit">Dar de alta</button>' +
          '</form>' +
          '<p class="note">Los estudiantes en prácticas van como refuerzo tutorizado: no cuentan para el mínimo de personas del turno.</p>' +
        '</section>' +
        '<section class="panel"><div class="panel-h"><h2>Equipo en activo</h2><span class="muted" style="font-size:.85rem">' + act.length + ' personas · horas de esta semana</span></div>' +
          '<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Turno habitual</th><th>Alta</th><th class="num">Horas</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<p class="note edit-only">Con «Foto» puedes poner a cada persona una imagen pequeña de su personaje (JPG o PNG). Se recorta en cuadrado y sustituye al dibujo; «Quitar foto» lo devuelve.</p>' +
        '</section>' +
        (gone.length ? '<section class="panel"><div class="panel-h"><h2>Bajas</h2></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Fecha de baja</th><th></th></tr></thead><tbody>' + goneRows + '</tbody></table></div></section>' : '') +
      '</div>' +
      '<div class="stack">' + accessPanel() +
      '<section class="panel"><h2>Requisitos de plantilla</h2><ul class="checks">' +
        checks.map(c => '<li><span class="mark ' + (c.ok ? 'ok' : 'err') + '">' + (c.ok ? '✓' : '!') + '</span><span>' + c.t + '</span></li>').join('') +
      '</ul><p class="note">No se puede dar de baja al último farmacéutico adjunto. Cada turno de entre semana necesita un farmacéutico o una persona responsable de turno. Los sábados rotan entre todo el equipo, siempre con alguien que pueda llevar el sábado. El cuadrante se genera con el turno habitual de cada persona y reparte mostrador, administración y gestión.</p></section>' +
      '</div>' +
    '</div>';
  }

  // ---------- Render: año ----------
  const isoWeek = d => {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  };
  function yearMondays(year) {
    const out = [];
    for (let m = mondayOf(new Date(year, 0, 4)); addDays(m, 3).getFullYear() === year; m = addDays(m, 7)) out.push(m);
    return out;
  }
  function ensureYear(year) {
    yearMondays(year).forEach(m => { if (!weekHasData(m) && ymd(addDays(m, 6)) >= todayKey()) generateWeek(m); });
  }
  function renderAnual() {
    const year = ui.year;
    ensureYear(year);
    let mondays = yearMondays(year);
    const sm0 = startDate() && mondayOf(startDate());
    if (sm0) {
      mondays = mondays.filter(m => m >= sm0);
      if (sm0.getFullYear() < year && mondays.length && ymd(addDays(sm0, 7)) === ymd(mondays[0])) mondays.unshift(sm0);
    }
    const tot = {};
    const rows = mondays.map(m => {
      const vacWeek = id => [0, 1, 2, 3, 4, 5].some(i => onVac(id, ymd(addDays(m, i))));
      const names = list => list.map(a => byId(a.id)).filter(Boolean)
        .map(p => '<span class="yp role-' + p.role + (vacWeek(p.id) ? ' vac' : '') + '">' + avatar(p) + esc(p.name.split(' ')[0]) + (vacWeek(p.id) ? ' <small>vacaciones</small>' : '') + '</span>').join('');
      let M = null, T = null, sat = null, satKey = null;
      for (let i = 0; i < 7; i++) {
        const key = ymd(addDays(m, i)); const day = S.schedule[key]; if (!day) continue;
        dayShifts(key).forEach(sh => (day[sh] || []).forEach(a => {
          const t = tot[a.id] || (tot[a.id] = { h: 0, S: 0 });
          if (onVac(a.id, key)) return;
          t.h += shHours(key, sh); if (keySat(key)) t.S++;
        }));
        if (keySat(key)) { sat = day.M || []; satKey = key; }
        else if (!M && day.M && day.M.length) { M = day.M; T = day.T || []; }
      }
      const isNow = ymd(m) === ymd(mondayOf(new Date()));
      return '<tr class="' + (isNow ? 'nowrow' : '') + '"><td class="mono">S' + pad(isoWeek(m)) + '</td>' +
        '<td class="nowrap">' + shortDate(m) + ' – ' + shortDate(addDays(m, 6)) +
          [0, 1, 2, 3, 4, 5, 6].map(i => addDays(m, i)).filter(holidayOf).map(d => '<div class="hol">Festivo ' + DAYS[d.getDay()].slice(0, 3).toLowerCase() + ' ' + shortDate(d) + '</div>').join('') + '</td>' +
        '<td><div class="ypl">' + (M ? names(M) : '<span class="muted">—</span>') + '</div></td>' +
        '<td><div class="ypl">' + (T ? names(T) : '<span class="muted">—</span>') + '</div></td>' +
        '<td><div class="ypl">' + (sat && sat.length ? names(sat) : (holidayOf(addDays(m, 5)) && S.settings.sat ? '<span class="hol">Festivo · libran</span> ' + names(satRotation(m)) : '<span class="muted">Cerrado</span>')) + '</div></td>' +
        '<td><button class="btn sm" data-act="goto-week" data-w="' + ymd(m) + '">Ver semana</button></td></tr>';
    }).join('');
    const people = activeStaff().sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const weeks = mondays.length;
    const totals = people.map(p => {
      const t = tot[p.id] || { h: 0, S: 0 };
      return '<tr><td><span class="person">' + avatar(p) + esc(p.name) + '</span></td><td class="num">' + t.S + '</td><td class="num"><strong>' + fmtH(t.h) + '</strong></td><td class="num">' + fmtH(t.h / weeks) + '</td></tr>';
    }).join('');
    return '<div class="stack">' +
      '<div class="weekbar"><div class="weeknav">' +
        '<button class="btn round" data-act="year-prev" aria-label="Año anterior">‹</button>' +
        '<span class="range">Año ' + year + '</span>' +
        '<button class="btn round" data-act="year-next" aria-label="Año siguiente">›</button>' +
        '<span class="pill ok">' + weeks + ' semanas</span>' +
      '</div></div>' +
      '<div class="cols">' +
        '<section class="panel"><div class="panel-h"><h2>Turnos por semana</h2><span class="muted" style="font-size:.85rem">Mañana ' + range('M') + ' · tarde ' + range('T') + ' · sábado ' + satRange() + '</span></div>' +
          '<div class="tablewrap"><table class="year"><thead><tr><th>Sem.</th><th>Fechas</th><th>Mañana</th><th>Tarde</th><th>Sábado</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '</section>' +
        '<section class="panel"><h2>Total del año</h2><div class="tablewrap"><table><thead><tr><th>Persona</th><th class="num">Sáb.</th><th class="num">Horas</th><th class="num">Media/sem.</th></tr></thead><tbody>' + totals + '</tbody></table></div>' +
          '<p class="note">Horas de cuadrante, sin extras, vacaciones ni guardias. Los festivos no están marcados todavía.</p>' +
        '</section>' +
      '</div></div>';
  }

  function renderHolidays() {
    const list = Object.keys(S.holidays || {}).sort().filter(k => k >= ymd(addDays(new Date(), -1)));
    return '<section class="panel"><h2>Festivos</h2><p class="note">La farmacia cierra estos días. Al añadir o quitar uno se rehace esa semana.</p>' +
      '<div>' + (list.map(k => '<div class="holrow"><span><strong class="nowrap">' + DAYS[parse(k).getDay()].slice(0, 3) + ' ' + shortDate(parse(k)) + ' ' + k.slice(0, 4) + '</strong> · ' + esc(S.holidays[k]) + '</span>' +
        '<button class="iconbtn" data-act="hol-del" data-d="' + k + '" aria-label="Quitar festivo">×</button></div>').join('') || '<p class="note">No hay festivos.</p>') + '</div>' +
      '<form class="grid" id="hol-form"><div class="field"><label for="hol-date">Fecha</label><input type="date" id="hol-date" required></div>' +
      '<div class="field"><label for="hol-name">Nombre</label><input id="hol-name" placeholder="Fiesta local"></div>' +
      '<button class="btn primary" type="submit">Añadir festivo</button></form></section>';
  }
  function refreshWeekOf(key) {
    const m = mondayOf(parse(key));
    if (ymd(addDays(m, 6)) < todayKey()) return;
    for (let i = 0; i < 7; i++) { const k = ymd(addDays(m, i)); if (k >= todayKey()) delete S.schedule[k]; }
    // la rotación de sábados posterior también cambia
    Object.keys(S.schedule).forEach(k => { if (k > key && keySat(k)) delete S.schedule[k]; });
    generateWeek(m);
  }

  // ---------- Render: mi horario ----------
  function myDay(id, key) {
    const d = parse(key);
    const hol = holidayOf(d);
    const guards = guardsOn(key).filter(g => (g.people || []).includes(id));
    if (hol) return { kind: 'fest', text: 'Festivo · ' + hol, guards };
    if (onVac(id, key)) return { kind: 'vac', text: 'Vacaciones', guards };
    const day = S.schedule[key];
    if (!isOpenDay(d) || !day) return { kind: 'off', text: 'Cerrado', guards };
    const sh = dayShifts(key).find(x => (day[x] || []).some(a => a.id === id));
    if (!sh) return { kind: 'free', text: 'Libre', guards };
    const me = day[sh].find(a => a.id === id);
    const mates = day[sh].filter(a => a.id !== id && !onVac(a.id, key)).map(a => byId(a.id)).filter(Boolean);
    return { kind: keySat(key) ? 'sat' : sh, sh, text: keySat(key) ? 'Sábado' : SH_LABEL[sh], range: shRange(key, sh), hours: shHours(key, sh), resp: RESP[me.resp], mates, guards };
  }
  function renderMi() {
    const people = activeStaff().filter(p => p.role !== 'estudiante');
    const p = ui.me && byId(ui.me) && byId(ui.me).active ? byId(ui.me) : null;
    if (!p) {
      return '<section class="panel mipick"><h2>¿Quién eres?</h2><p class="note">Elige tu nombre y verás directamente tu horario. Se recuerda en este móvil.</p>' +
        '<div class="mipeople">' + people.map(x => '<button class="mibtn" data-act="me-pick" data-id="' + x.id + '">' + avatar(x) + '<span>' + esc(x.name.split(' ')[0]) + '</span></button>').join('') + '</div></section>';
    }
    const realToday = new Date();
    const early = beforeStart(realToday);
    const today = early ? startDate() : realToday;
    // Asegura el cuadrante de las próximas semanas (se calcula igual para todos).
    for (let w = 0; w < 27; w++) { const m = addDays(mondayOf(today), w * 7); if (!weekHasData(m)) generateWeek(m); }
    const days = [];
    for (let i = 0; i < 14; i++) { const d = addDays(today, i); days.push({ d, key: ymd(d), info: myDay(p.id, ymd(d)) }); }
    const t = days[0].info;
    const matesHtml = list => list.map(m => '<span class="yp">' + avatar(m) + esc(m.name.split(' ')[0]) + '</span>').join('');
    const guardTxt = gs => gs.map(g => '<div class="miguard">' + guardLabel(g) + ' · ' + guardRange(g) + '</div>').join('');
    const hero = '<section class="mihero">' +
      '<div class="mime">' + avatar(p) + '<div><div class="mihello">Hola, ' + esc(p.name.split(' ')[0]) + '</div>' + (WEB ? '<button class="linkbtn" data-act="logout">Cerrar sesión</button>' : '<button class="linkbtn" data-act="me-change">No soy yo</button>') + '</div></div>' +
      '<div class="mitoday"><div class="milabel">' + (early ? 'Primer día · ' : 'Hoy · ') + DAYS[today.getDay()].toLowerCase() + ' ' + shortDate(today) + '</div>' +
        '<div class="mistate k-' + t.kind + '">' + esc(t.text) + (t.range ? ' <span>' + t.range + '</span>' : '') + '</div>' +
        (t.resp ? '<div class="misub">' + esc(t.resp) + (t.mates.length ? ' · con ' + t.mates.map(m => esc(m.name.split(' ')[0])).join(', ') : '') + '</div>' : '') + guardTxt(t.guards) +
      '</div></section>';
    // horas de esta semana y la siguiente
    const weekHours = m => { let h = 0; for (let i = 0; i < 7; i++) { const k = ymd(addDays(m, i)); const x = myDay(p.id, k); if (x.hours) h += x.hours; } return h; };
    const m0 = mondayOf(today), m1 = addDays(m0, 7);
    const list = days.map(({ d, key, info }) => '<li class="miday k-' + info.kind + (key === todayKey() ? ' now' : '') + '">' +
      '<div class="midate"><strong>' + DAYS[d.getDay()].slice(0, 3) + '</strong><span>' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</span></div>' +
      '<div class="miwhat"><div class="mishift">' + esc(info.text) + (info.range ? ' <span>' + info.range + '</span>' : '') + '</div>' +
        (info.resp ? '<div class="misub">' + esc(info.resp) + '</div>' : '') + guardTxt(info.guards) + '</div>' +
      '<div class="mimates">' + (info.mates ? matesHtml(info.mates) : '') + '</div></li>').join('');
    // próximos sábados
    const sats = [];
    for (let w = 0; w < 27 && sats.length < 4; w++) {
      const k = ymd(addDays(mondayOf(today), w * 7 + 5));
      if (k < todayKey()) continue;
      const day = S.schedule[k];
      if (day && (day.M || []).some(a => a.id === p.id) && !onVac(p.id, k)) sats.push(k);
    }
    const myGuards = (S.guards || []).filter(g => g.date >= todayKey() && (g.people || []).includes(p.id)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
    const y = today.getFullYear();
    const vacBox = yy => { const sm = vacSummary(p.id, yy); return '<div class="mivac"><span class="miyear">' + yy + '</span><strong>' + sm.left + '</strong><span>días pendientes</span><small>' + sm.taken + ' disfrutados · ' + sm.planned + ' con fecha</small></div>'; };
    const nextVac = (S.vacations || []).filter(v => v.staffId === p.id && v.to >= todayKey()).sort((a, b) => a.from.localeCompare(b.from)).slice(0, 3);
    return '<div class="stack">' + hero +
      '<div class="cols">' +
        '<section class="panel"><div class="panel-h"><h2>Mis próximos 14 días</h2><span class="muted" style="font-size:.9rem">Esta semana ' + fmtH(weekHours(m0)) + ' · la que viene ' + fmtH(weekHours(m1)) + '</span></div><ul class="milist">' + list + '</ul></section>' +
        '<div class="stack">' +
          '<section class="panel"><h2>Mis sábados</h2>' + (sats.length ? '<div class="vlist">' + sats.map(k => '<span class="vchip">' + shortDate(parse(k)) + '</span>').join('') + '</div>' : '<p class="note">No tienes sábados en los próximos meses.</p>') + '</section>' +
          '<section class="panel"><h2>Mis vacaciones</h2><div class="mivacs">' + vacBox(y) + (today.getMonth() >= 9 ? vacBox(y + 1) : '') + '</div>' +
            (nextVac.length ? '<div class="vlist">' + nextVac.map(v => '<span class="vchip">' + shortDate(parse(v.from)) + ' – ' + shortDate(parse(v.to)) + ' · ' + dayCount(v.from, v.to) + ' d</span>').join('') + '</div>' : '<p class="note">Sin vacaciones con fecha. Pídelas por WhatsApp.</p>') + '</section>' +
          '<section class="panel"><h2>Mis guardias</h2>' + (myGuards.length ? myGuards.map(g => '<div class="holrow"><strong>' + DAYS[parse(g.date).getDay()].slice(0, 3) + ' ' + shortDate(parse(g.date)) + '</strong><span>' + guardLabel(g) + ' · ' + guardRange(g) + '</span></div>').join('') : '<p class="note">No tienes guardias asignadas.</p>') + '</section>' +
        '</div>' +
      '</div></div>';
  }

  // ---------- Render: guardias ----------
  function renderGuardias() {
    const year = ui.year;
    const people = activeStaff().filter(p => p.role !== 'estudiante').sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const list = (S.guards || []).filter(g => g.date.slice(0, 4) === String(year)).sort((a, b) => a.date.localeCompare(b.date));
    const rows = list.map(g => '<tr class="' + (g.date < todayKey() ? 'past' : '') + '"><td class="nowrap"><strong>' + DAYS[parse(g.date).getDay()].slice(0, 3) + ' ' + shortDate(parse(g.date)) + '</strong>' + (holidayOf(parse(g.date)) ? '<div class="hol">Festivo</div>' : '') + '</td>' +
      '<td class="nowrap">' + guardLabel(g) + '<div class="muted" style="font-size:.85rem">' + guardRange(g) + '</div></td>' +
      '<td><div class="gpeople">' + people.map(p => {
        const on = (g.people || []).includes(p.id);
        return sync.canEdit
          ? '<label class="gchip' + (on ? ' on' : '') + '"><input type="checkbox" data-act="g-toggle" data-id="' + g.id + '" data-staff="' + p.id + '"' + (on ? ' checked' : '') + '>' + avatar(p) + esc(p.name.split(' ')[0]) + '</label>'
          : (on ? '<span class="yp">' + avatar(p) + esc(p.name.split(' ')[0]) + '</span>' : '');
      }).join('') + ((g.people || []).length || sync.canEdit ? '' : '<span class="muted">Sin asignar</span>') + '</div></td>' +
      '<td><div class="rowact"><button class="iconbtn" data-act="g-del" data-id="' + g.id + '" aria-label="Eliminar guardia">×</button></div></td></tr>').join('');
    const counts = people.map(p => ({ p, n: list.filter(g => (g.people || []).includes(p.id)).length }));
    return '<div class="stack">' +
      '<div class="weekbar"><div class="weeknav">' +
        '<button class="btn round" data-act="year-prev" aria-label="Año anterior">‹</button>' +
        '<span class="range">Guardias ' + year + '</span>' +
        '<button class="btn round" data-act="year-next" aria-label="Año siguiente">›</button>' +
        '<span class="pill ok">' + list.length + (list.length === 1 ? ' guardia' : ' guardias') + '</span>' +
      '</div></div>' +
      '<div class="cols">' +
        '<section class="panel"><div class="panel-h"><h2>Calendario de guardias</h2><span class="muted" style="font-size:.9rem">Se pagan aparte: no cuentan en las horas</span></div>' +
          (list.length ? '<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Quién</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
            : '<p class="note">Todavía no hay guardias en ' + year + '. Cuando tengáis las fechas, se añaden aquí y se asigna quién las hace.</p>') +
        '</section>' +
        '<div class="stack">' +
          '<section class="panel edit-only"><h2>Añadir guardia</h2><form class="grid" id="guard-form">' +
            '<div class="field"><label for="g-date">Fecha</label><input type="date" id="g-date" required></div>' +
            '<div class="field"><label for="g-type">Tipo</label><select id="g-type"><option value="noche">Nocturna (' + hm(times('T')[1]) + '–' + hm(times('M')[0]) + ')</option><option value="24h">24 horas</option></select></div>' +
            '<button class="btn primary" type="submit">Añadir</button></form>' +
            '<p class="note">Después marca en la lista quién hace cada guardia.</p></section>' +
          '<section class="panel"><h2>Reparto ' + year + '</h2>' + counts.map(c => '<div class="holrow"><span class="person">' + avatar(c.p) + esc(c.p.name.split(' ')[0]) + '</span><strong>' + c.n + '</strong></div>').join('') + '</section>' +
        '</div>' +
      '</div></div>';
  }

  // ---------- Render: vacaciones ----------
  function renderVacaciones() {
    const year = ui.year;
    const vp = ui.vacPending;
    const mine = WEB && AUTH.user && !AUTH.user.owner ? AUTH.user.staffId : null;   // el equipo solo ve las suyas
    const people = activeStaff().filter(p => p.role !== 'estudiante' && (!mine || p.id === mine)).sort((a, b) => ROLES[a.role].order - ROLES[b.role].order || a.name.localeCompare(b.name));
    const fmtRange = v => v.from === v.to ? shortDate(parse(v.from)) : shortDate(parse(v.from)) + ' – ' + shortDate(parse(v.to));
    const cards = people.map(p => {
      const sm = vacSummary(p.id, year);
      const pct = n => Math.max(0, Math.min(100, n / sm.total * 100));
      const periods = (S.vacations || []).filter(v => v.staffId === p.id && clipDays(v, year + '-01-01', year + '-12-31'))
        .sort((a, b) => a.from.localeCompare(b.from));
      return '<article class="vcard">' +
        '<div class="vhead"><span class="person">' + avatar(p) + '<span class="pcap">' + esc(p.name) + '<small>' + ROLES[p.role].short + '</small></span></span>' +
          '<div class="vleft"><strong>' + sm.left + '</strong><span>días pendientes<br>de disfrutar</span></div></div>' +
        '<div class="vbar" role="img" aria-label="' + sm.taken + ' disfrutados, ' + sm.planned + ' con fecha y ' + Math.max(0, sm.free) + ' sin fecha de ' + sm.total + '">' +
          '<span class="vt" style="width:' + pct(sm.taken) + '%"></span><span class="vp" style="width:' + pct(sm.planned) + '%"></span></div>' +
        '<div class="vnums"><span><i class="vt"></i>Disfrutados <strong>' + sm.taken + '</strong></span><span><i class="vp"></i>Con fecha <strong>' + sm.planned + '</strong></span><span><i class="vf"></i>Sin fecha <strong>' + Math.max(0, sm.free) + '</strong></span></div>' +
        (sm.free < 0 ? '<div class="issue warn">Se pasa ' + (-sm.free) + ' días de los ' + sm.total + '</div>' : '') +
        '<div class="vlist">' + (periods.map(v => '<span class="vchip' + (v.to < todayKey() ? ' done' : '') + '"' + (v.approvedOverlap ? ' title="Aprobadas aunque coinciden con otra persona"' : '') + '>' + fmtRange(v) + ' · ' + clipDays(v, year + '-01-01', year + '-12-31') + ' d' + (v.approvedOverlap ? ' · solape aprobado' : '') +
          '<button class="iconbtn" data-act="vac-del" data-id="' + v.id + '" aria-label="Quitar estas vacaciones">×</button></span>').join('') || '<span class="muted">Sin vacaciones con fecha.</span>') + '</div>' +
      '</article>';
    }).join('');
    const upcoming = (S.vacations || []).filter(v => v.to >= todayKey() && (!mine || v.staffId === mine)).sort((a, b) => a.from.localeCompare(b.from)).slice(0, 8);
    return '<div class="stack">' +
      '<div class="weekbar"><div class="weeknav">' +
        '<button class="btn round" data-act="year-prev" aria-label="Año anterior">‹</button>' +
        '<span class="range">' + (mine ? 'Mis vacaciones ' : 'Vacaciones ') + year + '</span>' +
        '<button class="btn round" data-act="year-next" aria-label="Año siguiente">›</button>' +
        '<span class="pill ok">' + vacAllowance() + ' días naturales por persona</span>' +
      '</div></div>' +
      '<div class="cols">' +
        '<div class="vgrid">' + cards + '</div>' +
        '<div class="stack">' +
          '<section class="panel edit-only"><h2>Añadir vacaciones</h2>' +
            '<form class="grid" id="vac-form"><div class="field"><label for="vac-who">Persona</label><select id="vac-who">' + people.map(p => '<option value="' + p.id + '"' + (vp && vp.staffId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>' +
            '<div class="field"><label for="vac-from">Desde</label><input type="date" id="vac-from" required value="' + (vp ? vp.from : '') + '"></div>' +
