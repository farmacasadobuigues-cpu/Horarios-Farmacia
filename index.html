  // ---------- Acceso con usuario y contraseña (web) ----------
  // El cuadrante se publica cifrado (datos.enc.json, AES-GCM). La llave del cuadrante va guardada en
  // acceso.json una vez por persona, cifrada con su contraseña (PBKDF2). Sin contraseña no se puede leer.
  const AUTH = { dk: null, user: null, access: null, box: null };
  const TE = new TextEncoder(), TD = new TextDecoder();
  const fromB64 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const toB64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const normUser = u => String(u || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '');
  async function pwKey(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', TE.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  const dataKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function unwrapKey(entry, pw) {
    const k = await pwKey(pw, fromB64(entry.salt), entry.iter);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(entry.iv) }, k, fromB64(entry.wk)));
  }
  async function wrapKey(raw, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 200000;
    const k = await pwKey(pw, salt, iter);
    return { salt: toB64(salt), iv: toB64(iv), iter, wk: toB64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, raw)) };
  }
  async function decryptBox(raw, box) { return TD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(box.iv) }, await dataKey(raw), fromB64(box.ct))); }
  async function encryptBox(raw, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return { v: 1, iv: toB64(iv), ct: toB64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await dataKey(raw), TE.encode(text))) };
  }
  const isOwnerUser = () => !!(AUTH.user && AUTH.user.owner);
  function showLogin(msg) {
    document.body.classList.add('locked');
    let el = document.getElementById('login');
    if (!el) { el = document.createElement('section'); el.id = 'login'; el.className = 'login'; document.body.appendChild(el); }
    el.innerHTML = '<form id="login-form" class="loginbox" autocomplete="on">' +
      '<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" fill="none" stroke="currentColor" stroke-width="4.5"/><text x="32" y="38.5" text-anchor="middle" font-family="Titillium Web, sans-serif" font-weight="600" font-size="25" fill="currentColor">Cb</text><rect x="17" y="45" width="30" height="2.6" rx="1.3" fill="#50c4ca"/></svg>' +
      '<h2>Cuadrante del equipo</h2><p class="note">Entra con tu usuario y tu contraseña.</p>' +
      (msg ? '<div class="banner warn">' + esc(msg) + '</div>' : '') +
      '<div class="field"><label for="lg-user">Usuario</label><input id="lg-user" name="username" autocomplete="username" autocapitalize="none" required></div>' +
      '<div class="field"><label for="lg-pass">Contraseña</label><input id="lg-pass" name="password" type="password" autocomplete="current-password" required></div>' +
      '<label class="chk"><input type="checkbox" id="lg-remember" checked> Recordarme en este dispositivo</label>' +
      '<button class="btn primary" type="submit" id="lg-go">Entrar</button>' +
      '<p class="note">¿No tienes usuario o has olvidado la contraseña? Pídeselo a la farmacia.</p></form>';
    el.hidden = false;
  }
  function hideLogin() { document.body.classList.remove('locked'); const el = document.getElementById('login'); if (el) el.hidden = true; }
  async function openWith(raw, username) {
    const d = JSON.parse(await decryptBox(raw, AUTH.box));
    AUTH.dk = raw;
    AUTH.user = (AUTH.access.users || []).find(x => x.u === username) || { u: username };
    EMB = d; S = JSON.parse(JSON.stringify(d)); migrate();
    if (AUTH.user.staffId) { ui.me = AUTH.user.staffId; try { localStorage.setItem(KEY + ':me', ui.me); } catch (e) {} }
    sync.canEdit = isOwnerUser() && !!ghToken();
    if (sync.canEdit) restoreDraft();
    hideLogin();
    document.getElementById('hdr-logout').hidden = false;
    if (isOwnerUser() && ui.tab === 'mi') ui.tab = 'equipo';
    setSync(sync.canEdit ? 'ok' : 'ro', sync.canEdit ? (sync.dirty ? 'Editando · cambios sin publicar' : 'Puedes editar · el equipo solo consulta') : (isOwnerUser() ? 'Solo consulta · entra con tu clave para editar' : 'Hola, ' + (AUTH.user.staffId && byId(AUTH.user.staffId) ? byId(AUTH.user.staffId).name.split(' ')[0] : AUTH.user.u)));
    render();
  }
  async function doLogin(username, pw, remember) {
    const u = normUser(username);
    const entry = (AUTH.access.users || []).find(x => x.u === u);
    const btn = document.getElementById('lg-go'); if (btn) { btn.disabled = true; btn.textContent = 'Comprobando…'; }
    let raw = null;
    if (entry) { try { raw = await unwrapKey(entry, pw); } catch (e) { raw = null; } }
    if (!raw) { showLogin('Usuario o contraseña incorrectos.'); const f = document.getElementById('lg-user'); if (f) f.value = username; return; }
    if (remember) { try { localStorage.setItem(KEY + ':sess', JSON.stringify({ u, dk: toB64(raw) })); } catch (e) {} }
    ui.tab = entry.owner ? 'equipo' : 'mi';
    try { await openWith(raw, u); } catch (e) { showLogin('No se ha podido abrir el cuadrante. Recarga la página.'); }
  }
  function logout() {
    try { localStorage.removeItem(KEY + ':sess'); localStorage.removeItem(KEY + ':me'); } catch (e) {}
    location.reload();
  }
  // Publica un archivo en el repositorio (solo la propietaria, con su clave de GitHub).
  async function ghPut(path, text, message, checkRemote) {
    const token = ghToken();
    if (!token) throw { code: 'auth' };
    const api = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + path;
    const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    const cur = await fetch(api + '?ref=' + GH_BRANCH + '&t=' + Date.now(), { headers, cache: 'no-store' });
    if (cur.status === 401 || cur.status === 403) throw { code: 'auth' };
    let sha;
    if (cur.ok) { const j = await cur.json(); sha = j.sha; if (checkRemote) await checkRemote(j); }
    const body = { message, content: b64enc(text), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(api, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
    if (r.status === 401 || r.status === 403) throw { code: 'auth' };
    if (r.status === 409) throw { code: 'conflict' };
    if (!r.ok) throw { code: 'upstream' };
  }

        '<div class="field"><label for="acc-pass">Contraseña nueva</label><input id="acc-pass" required minlength="6" placeholder="mínimo 6 caracteres"></div>' +
        '<button class="btn primary" type="submit">Guardar acceso</button><button class="btn" type="button" data-act="acc-cancel">Cancelar</button></form>';

      rows.map(r => {
        const cur = userFor(r.id);
        return '<div class="accrow"><span class="person">' + (r.p ? avatar(r.p) : '') + '<span class="pcap">' + esc(r.name) + '<small>' + (cur ? 'Usuario: <strong>' + esc(cur.u) + '</strong>' : 'Sin acceso') + '</small></span></span>' +
          '<span class="rowact"><button class="btn sm" data-act="acc-set" data-id="' + r.id + '">' + (cur ? 'Nueva contraseña' : 'Crear acceso') + '</button>' +
          (cur && r.id !== 'owner' ? '<button class="btn sm danger" data-act="acc-del" data-id="' + r.id + '">Quitar</button>' : '') + '</span></div>' +

  async function saveAccess(id, username, pw) {
    const u = normUser(username);
    if (!u || pw.length < 6) { toast('Pon un usuario y una contraseña de al menos 6 caracteres.'); return; }
    const users = (AUTH.access.users || []).slice();
    if (users.some(x => x.u === u && (id === 'owner' ? !x.owner : x.staffId !== id))) { toast('Ese usuario ya lo tiene otra persona.'); return; }
    const entry = Object.assign({ u }, id === 'owner' ? { owner: true } : { staffId: id }, await wrapKey(AUTH.dk, pw));
    const next = users.filter(x => id === 'owner' ? !x.owner : x.staffId !== id).concat(entry);
    await publishAccess(next, 'Acceso guardado. Usuario «' + u + '»: pásale la contraseña en privado.');
  }
  async function publishAccess(users, okMsg) {
    toast('Guardando accesos…');
    try {
      await ghPut('acceso.json', JSON.stringify({ v: 1, users }, null, 1), 'Actualiza los accesos de la app');

    } catch (e) {
      toast(e && e.code === 'auth' ? 'Tu clave de GitHub no sirve para guardar. Vuelve a entrar con ella.' : 'No se han podido guardar los accesos. Prueba otra vez.');
    }
  }

  // Acceso de la propietaria en la web: una clave de GitHub guardada solo en su navegador.
  const ghToken = () => { try { return localStorage.getItem(KEY + ':gh') || ''; } catch (e) { return ''; } };
  function ownerFooter() {
    if (sync.canEdit || !isOwnerUser()) return '';
    if (!ui.ownerLogin) return '<div class="ownerfoot"><button class="linkbtn" data-act="owner-login">Acceso de la propietaria</button></div>';
    return '<section class="panel ownerbox"><h2>Acceso de la propietaria</h2>' +
      '<p class="note">Para editar y publicar, pega tu clave de GitHub. Se guarda solo en este navegador.</p>' +
      '<form class="grid" id="owner-form" autocomplete="off"><div class="field"><label for="gh-token">Clave de GitHub</label><input id="gh-token" type="password" required placeholder="github_pat_…"></div>' +
      '<button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" data-act="owner-cancel">Cancelar</button></form></section>';
  }
  async function ownerLogin(token) {
    try {
      const r = await fetch('https://api.github.com/repos/' + GH_REPO, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } });
      const j = r.ok ? await r.json() : null;
      if (!j || !j.permissions || !j.permissions.push) { toast('Esa clave no tiene permiso para guardar en el repositorio de la app.'); return; }
    } catch (e) { toast('No se ha podido comprobar la clave. Revisa la conexión.'); return; }
    try { localStorage.setItem(KEY + ':gh', token); } catch (e) {}
    ui.ownerLogin = false; sync.canEdit = isOwnerUser();
    restoreDraft();
    setSync('ok', sync.dirty ? 'Editando · cambios sin publicar' : 'Puedes editar · el equipo solo consulta');

  function restoreDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY + ':draft'));
      if (d && d.S && d.baseRev === (EMB && EMB.rev || null)) { S = d.S; migrate(); sync.dirty = true; scheduleAutoPublish(); }
      else localStorage.removeItem(KEY + ':draft');
    } catch (e) {}
  }

  // Quien solo consulta ve el cuadrante sin controles de edición.
  const VIEW_ACTS = ['prev', 'next', 'thisweek', 'goto-week', 'year-prev', 'year-next', 'me-pick', 'me-change', 'owner-login', 'owner-cancel', 'logout'];
  function applyReadOnly() {
    const m = document.getElementById('main');
    const alta = m.querySelector('#alta-form'); if (alta && alta.closest('.panel')) alta.closest('.panel').remove();
    m.querySelectorAll('button[data-act]').forEach(b => { if (!VIEW_ACTS.includes(b.dataset.act)) b.remove(); });
    m.querySelectorAll('label.btn, select.add, .actions .muted, .edit-only').forEach(e => e.remove());
    m.querySelectorAll('select, input, textarea').forEach(e => { if (!e.closest('.ownerbox')) e.disabled = true; });
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }

  // ---------- Acciones ----------
  function canRemove(p) {
    if (p.role === 'titular') return 'La titular no se puede dar de baja.';
    if (p.role === 'adjunto' && activeStaff().filter(x => x.role === 'adjunto').length <= 1)
      return 'Siempre tiene que haber al menos un farmacéutico adjunto. Da de alta a otro antes de esta baja.';
    return null;
  }

  function doBaja(id) {
    const p = byId(id);
    p.active = false; p.until = todayKey();
    const today = todayKey();
    Object.keys(S.schedule).forEach(k => {
      if (k < today) return;
      SHIFTS.forEach(sh => { S.schedule[k][sh] = (S.schedule[k][sh] || []).filter(a => a.id !== id); });
    });
    // Rellena los turnos que quedan cortos a partir de hoy.
    const weeks = new Set(Object.keys(S.schedule).filter(k => k >= today).map(k => ymd(mondayOf(parse(k)))));
    weeks.forEach(w => generateWeek(parse(w)));
    save();
    toast(p.name + ' dada/o de baja. Turnos pendientes reasignados.');
  }

  const userAct = () => { ui.userEdit = true; setTimeout(() => { ui.userEdit = false; }, 0); };
  document.addEventListener('click', e => {
    userAct();
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      ui.tab = tab.dataset.tab; ui.confirm = null; ui.editing = null; ui.userEdit = false;
      try { localStorage.setItem(KEY + ':tab', ui.tab); } catch (err) {}
      render(); return;
    }
    const el = e.target.closest('button[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'prev': ui.week = addDays(ui.week, -7); ui.confirm = null; break;
      case 'next': ui.week = addDays(ui.week, 7); ui.confirm = null; break;
      case 'thisweek': ui.week = mondayOf(new Date()); break;
      case 'publish': publishNow(); return;
      case 'owner-login': ui.ownerLogin = true; render(); setTimeout(() => { const t = document.getElementById('gh-token'); if (t) t.focus(); }, 0); return;
      case 'owner-cancel': ui.ownerLogin = false; break;
      case 'logout': logout(); return;
      case 'acc-set': ui.accFor = id; break;
      case 'acc-cancel': ui.accFor = null; break;
      case 'acc-del': {
        const users = (AUTH.access.users || []).filter(x => x.staffId !== id);
        publishAccess(users, 'Acceso quitado. Si esa persona deja la farmacia, pídeme también cambiar la llave del cuadrante.');
        return;
      }
      case 'owner-logout':
        try { localStorage.removeItem(KEY + ':gh'); } catch (err) {}
        sync.canEdit = false; ui.tab = 'mi'; setSync('ro', 'Solo consulta'); toast('Has salido del modo edición en este navegador.'); break;
      case 'discard':
        try { localStorage.removeItem(KEY + ':draft'); } catch (err) {}
        S = JSON.parse(JSON.stringify(EMB)); migrate(); sync.dirty = false; clearTimeout(sync.autoTimer); sync.autoAt = 0; toast('Cambios descartados.'); break;
      case 'vac-force': {
        const v = ui.vacPending; if (!v) break;
        S.vacations = (S.vacations || []).concat({ id: uid(), staffId: v.staffId, from: v.from, to: v.to, approvedOverlap: true });
        ui.vacPending = null; save(); toast('Vacaciones aprobadas aunque coinciden con otra persona.'); break;
      }
      case 'vac-cancel': ui.vacPending = null; break;
      case 'me-pick': ui.me = id; try { localStorage.setItem(KEY + ':me', id); } catch (err) {} break;
      case 'me-change': ui.me = null; try { localStorage.removeItem(KEY + ':me'); } catch (err) {} break;
      case 'g-del': S.guards = (S.guards || []).filter(g => g.id !== id); save(); toast('Guardia eliminada.'); break;
      case 'vac-del': S.vacations = (S.vacations || []).filter(v => v.id !== id); save(); toast('Vacaciones quitadas.'); break;
      case 'goto-week': ui.week = parse(el.dataset.w); ui.tab = 'cuadrante'; window.scrollTo(0, 0); break;
      case 'year-prev': ui.year--; break;
      case 'year-next': ui.year++; break;
      case 'regen': ui.confirm = 'regen'; break;
      case 'regen-yes': generateWeek(ui.week); ui.confirm = null; toast('Cuadrante generado para la semana.'); break;
      case 'cancel': ui.confirm = null; ui.editing = null; break;
      case 'rm': {
        const day = S.schedule[el.dataset.key];
        day[el.dataset.sh] = day[el.dataset.sh].filter(a => a.id !== id);
        save(); break;
      }
      case 'baja': {
        const why = canRemove(byId(id));
        if (why) { toast(why); return; }
        ui.confirm = 'baja:' + id; break;
      }
      case 'baja-yes': ui.confirm = null; doBaja(id); break;
      case 'alta-again': {
        const p = byId(id);
        p.active = true; p.until = null; p.since = todayKey();
        save(); toast(p.name + ' vuelve a estar de alta. Pulsa «Generar cuadrante» para incluirla/o.'); break;
      }
      case 'edit': ui.editing = id; ui.confirm = null; break;
      case 'ed-save': {
        const p = byId(id);
        const name = document.getElementById('ed-name').value.trim();
        const role = document.getElementById('ed-role').value;
        if (!name) { toast('Escribe un nombre.'); return; }
        if (p.role === 'adjunto' && role !== 'adjunto' && activeStaff().filter(x => x.role === 'adjunto').length <= 1) {
          toast('Es el único farmacéutico adjunto: no puede cambiar de rol.'); return;
        }
        if (role === 'titular' && p.role !== 'titular' && S.staff.some(x => x.active && x.role === 'titular')) {
          toast('Ya hay una persona titular.'); return;
        }
        if (p.role === 'titular' && role !== 'titular') { toast('La titular no puede cambiar de rol.'); return; }
        p.name = name; p.role = role; p.shift = document.getElementById('ed-shift').value; p.lead = document.getElementById('ed-lead').checked; p.senior = document.getElementById('ed-senior').checked; const avSel = document.querySelector('input[name="ed-av"]:checked'); if (avSel) p.avatar = avSel.value;
        ui.editing = null; save(); toast('Datos actualizados.'); break;
      }
      case 'reset': ui.confirm = 'reset'; break;
      case 'photo-del': delete byId(id).photo; save(); toast('Foto quitada; vuelve el dibujo.'); break;
      case 'hol-del': delete S.holidays[el.dataset.d]; refreshWeekOf(el.dataset.d); save(); toast('Festivo quitado.'); break;
      case 'reset-yes': S = seed(); ui.confirm = null; save(); toast('Equipo inicial restaurado.'); break;
      case 'copy': {
        const box = document.getElementById('data-box');
        const fallback = () => { box.focus(); box.select(); toast('Texto seleccionado: cópialo con Ctrl+C.'); };
        try { navigator.clipboard.writeText(box.value).then(() => toast('Datos copiados.'), fallback); } catch (err) { fallback(); }
        return;
      }
      case 'import': {
        try {
          const d = JSON.parse(document.getElementById('data-box').value);
          if (!Array.isArray(d.staff) || !d.settings) throw new Error('formato');
          d.schedule = d.schedule || {};
          S = d; save(); toast('Datos cargados.');
        } catch (err) { toast('El texto pegado no son datos válidos de la aplicación.'); return; }
        break;
      }
      default: return;
    }
    render();
  });

  document.addEventListener('change', e => {
    userAct();
    const el = e.target;
    const act = el.dataset.act;
    if (!act) return;
    if (act === 'g-toggle') {
      const g = (S.guards || []).find(x => x.id === el.dataset.id); if (!g) return;
      const sid = el.dataset.staff;
      g.people = (g.people || []).filter(x => x !== sid).concat(el.checked ? [sid] : []);
      save(); render(); return;
    }
    if (act === 'photo') {
      const file = el.files && el.files[0];
      if (!file) return;
      // Se recorta en cuadrado y se reduce a 120 px para que ocupe poco.
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 120, side = Math.min(img.width, img.height);
          const c = document.createElement('canvas'); c.width = c.height = size;
          c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          const p = byId(el.dataset.id);
          p.photo = c.toDataURL('image/jpeg', 0.85);
          ui.userEdit = true;
          save(); ui.userEdit = false; render(); toast('Foto puesta a ' + p.name.split(' ')[0] + '.');
        };
        img.onerror = () => toast('No se ha podido leer la imagen. Prueba con un JPG o PNG.');
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      return;
    }
    if (act === 'resp') {
      const a = S.schedule[el.dataset.key][el.dataset.sh].find(x => x.id === el.dataset.id);
      a.resp = el.value;
    } else if (act === 'add') {
      if (!el.value) return;
      const p = byId(el.value);
      const day = S.schedule[el.dataset.key] || (S.schedule[el.dataset.key] = { M: [], T: [] });
      const list = day[el.dataset.sh];
      const hasCounter = list.some(x => x.resp === 'mostrador');
      list.push({ id: p.id, resp: p.role === 'estudiante' ? 'practicas' : hasCounter && !isPharm(p) ? 'mostrador' : (isPharm(p) && list.some(x => isPharm(byId(x.id))) ? 'gestion' : 'mostrador') });
    } else if (act === 'set-sat-close') {
      S.settings.sat.close = el.value;
    } else if (act === 'set-sat-mode') {
      S.settings.sat.mode = el.value;
      const t = ymd(mondayOf(new Date()));
      Object.keys(S.schedule).forEach(k => { if (k >= t && keySat(k)) delete S.schedule[k]; });
      Object.keys(S.schedule).filter(k => k >= t).map(k => ymd(mondayOf(parse(k)))).filter((v, i, a) => a.indexOf(v) === i).forEach(w => generateWeek(parse(w)));
    } else if (act === 'set-sat-min') {
      S.settings.sat.min = Number(el.value);
    } else if (act === 'set-min') {
      S.settings.min = Object.assign({ M: 3, T: 3 }, S.settings.min, { [el.dataset.sh]: Number(el.value) });
    } else if (act === 'set-tstart') {
      S.settings.tStart = el.value;
    } else if (act === 'set-mstart') {
      S.settings.mStart = el.value;
    } else if (act === 'set-open') {
      S.settings.open = el.value;
    } else if (act === 'set-day') {
      const v = Number(el.value);
      S.settings.days = el.checked ? S.settings.days.concat(v) : S.settings.days.filter(x => x !== v);
    } else return;
    save(); render();
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    userAct();
    if (e.target.id === 'login-form') {
      doLogin(document.getElementById('lg-user').value, document.getElementById('lg-pass').value, document.getElementById('lg-remember').checked);
      return;
    }
    if (e.target.id === 'acc-form') {
      saveAccess(e.target.dataset.id, document.getElementById('acc-user').value, document.getElementById('acc-pass').value);
      return;
    }
    if (e.target.id === 'owner-form') {
      const tk = document.getElementById('gh-token').value.trim();
      if (tk) ownerLogin(tk);
      return;
    }
    if (e.target.id === 'guard-form') {
      const date = document.getElementById('g-date').value;
      if (!date) { toast('Elige la fecha de la guardia.'); return; }
      if ((S.guards || []).some(g => g.date === date)) { toast('Ya hay una guardia ese día.'); return; }
      S.guards = (S.guards || []).concat({ id: uid(), date, type: document.getElementById('g-type').value, people: [] });
      ui.year = Number(date.slice(0, 4));
      save(); render(); toast('Guardia añadida: ' + longDate(parse(date)).toLowerCase() + '. Marca quién la hace.');
      return;
    }
    if (e.target.id === 'vac-form') {
      const staffId = document.getElementById('vac-who').value;
      let from = document.getElementById('vac-from').value, to = document.getElementById('vac-to').value;
      if (!from || !to) { toast('Elige las fechas de inicio y fin.'); return; }
      if (to < from) { const t = from; from = to; to = t; }
      if ((S.vacations || []).some(v => v.staffId === staffId && v.from <= to && from <= v.to)) { toast('Se solapa con otras vacaciones de esa persona.'); return; }
      const clash = (S.vacations || []).filter(v => v.staffId !== staffId && v.from <= to && from <= v.to);
      if (clash.length) { ui.vacPending = { staffId, from, to, clash: clash.map(v => v.id) }; render(); return; }
      ui.vacPending = null;
      S.vacations = (S.vacations || []).concat({ id: uid(), staffId, from, to });
      save(); render();
      const sm = vacSummary(staffId, Number(from.slice(0, 4)));
      toast(byId(staffId).name.split(' ')[0] + ': ' + dayCount(from, to) + ' días añadidos.' + (sm.free < 0 ? ' Se pasa de ' + sm.total + ' días.' : ' Le quedan ' + sm.free + ' sin fecha.'));
      return;
    }
    if (e.target.id === 'hol-form') {
      const d = document.getElementById('hol-date').value;
      if (!d) { toast('Elige una fecha.'); return; }
      S.holidays = S.holidays || {};
      S.holidays[d] = document.getElementById('hol-name').value.trim() || 'Festivo';
      refreshWeekOf(d); save(); render();
      toast('Festivo añadido: ' + longDate(parse(d)).toLowerCase() + '.');
      return;
    }
    if (e.target.id === 'alta-form') {
      const name = document.getElementById('alta-name').value.trim();
      const role = document.getElementById('alta-role').value;
      if (!name) { toast('Escribe el nombre de la persona.'); return; }
      if (role === 'titular' && S.staff.some(p => p.active && p.role === 'titular')) { toast('Ya hay una persona titular en la farmacia.'); return; }
      S.staff.push({ id: uid(), name, role, shift: document.getElementById('alta-shift').value, lead: document.getElementById('alta-lead').checked, senior: document.getElementById('alta-senior').checked, avatar: (document.querySelector('input[name="alta-av"]:checked') || {}).value || 'droide', active: true, since: todayKey(), until: null });
      save(); render();
      toast(name + ' dada/o de alta como ' + ROLES[role].label.toLowerCase() + '. Pulsa «Generar cuadrante» para incluirla/o.');
    }
  });

  // ---------- Publicación para el equipo ----------
  function setSync(state, text) {
    const el = document.getElementById('sync');
    el.hidden = false; el.dataset.state = state; el.textContent = text;
  }
  function buildPage() {
    const state = JSON.parse(JSON.stringify(S));
    state.rev = new Date().toISOString();
    const json = JSON.stringify(state).replace(/</g, '\\u003c');
    const content = PAGE_SOURCE.replace(/<script type="application\/json" id="estado">[\s\S]*?<\/script>/, () => '<script type="application/json" id="estado">' + json + '</' + 'script>');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + PAGE_RESET + '</style></head><body>' + content + '</body></html>';
  }
  // Se publica sola a los 2 minutos sin tocar nada, y al salir de la app si quedan cambios.
  const AUTO_MS = 120000;
  function scheduleAutoPublish() {
    clearTimeout(sync.autoTimer);
    sync.autoAt = Date.now() + AUTO_MS;
    sync.autoTimer = setTimeout(autoPublish, AUTO_MS);
  }
  function autoPublish() {
    if (!sync.dirty || sync.publishing) return;
    const a = document.activeElement;
    const busy = ui.editing || ui.vacPending || (a && a.closest && a.closest('#main form'));
    if (busy) { sync.autoAt = Date.now() + 30000; sync.autoTimer = setTimeout(autoPublish, 30000); return; }
    publishNow();
  }
  setInterval(() => {
    const el = document.getElementById('autopub');
    if (!el || !sync.autoAt) return;
    const s = Math.max(0, Math.round((sync.autoAt - Date.now()) / 1000));
    el.textContent = s > 0 ? 'Se publicará sola en ' + Math.floor(s / 60) + ':' + pad(s % 60) + ' si no haces más cambios.' : 'Publicando…';
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && sync.dirty && !sync.publishing && sync.canEdit) publishNow(); });

  const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64dec = b64 => { const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); };
  async function publishWeb() {
    if (!ghToken() || !AUTH.dk) { sync.canEdit = false; toast('Vuelve a entrar con tu clave para publicar.'); render(); return; }
    sync.publishing = true; render(); setSync('saving', 'Publicando…');
    try {
      const state = JSON.parse(JSON.stringify(S));
      state.rev = new Date().toISOString();
      const box = await encryptBox(AUTH.dk, JSON.stringify(state));
      await ghPut('datos.enc.json', JSON.stringify(box), 'Actualiza el cuadrante desde la app', async j => {
        let remoteRev = null;
        try { remoteRev = JSON.parse(await decryptBox(AUTH.dk, JSON.parse(b64dec(j.content || '')))).rev || null; } catch (e) {}
        if (EMB && remoteRev && EMB.rev && remoteRev !== EMB.rev) throw { code: 'conflict' };
      });
      EMB = state; AUTH.box = box;
      try { localStorage.removeItem(KEY + ':draft'); } catch (e) {}
      sync.dirty = false; clearTimeout(sync.autoTimer); sync.autoAt = 0;
      setSync('ok', 'Publicado · el equipo lo verá en 1 o 2 minutos');
      toast('Publicado. El equipo lo verá al abrir o recargar la web (tarda 1 o 2 minutos en actualizarse).');
    } catch (e) {
      const code = e && e.code;
      if (code === 'auth') { try { localStorage.removeItem(KEY + ':gh'); } catch (er) {} sync.canEdit = false; toast('Tu clave de GitHub ya no sirve (caducada o sin permiso). Entra con una nueva; tus cambios siguen guardados.'); }
      else if (code === 'conflict') toast('Hay una versión más nueva publicada desde otro dispositivo. Recarga la página antes de publicar; tus cambios siguen guardados aquí.');
      else toast('No se ha podido publicar. Revisa la conexión y prueba otra vez; tus cambios siguen guardados.');
      setSync(sync.canEdit ? 'error' : 'ro', sync.canEdit ? 'Sin publicar' : 'Solo consulta');
    }
    sync.publishing = false; render();
  }
  async function startWeb() {
    document.body.classList.add('locked');
    setSync('ro', 'Cargando…');
    try {
      const [a, d] = await Promise.all([fetch('acceso.json?v=' + Date.now(), { cache: 'no-store' }), fetch('datos.enc.json?v=' + Date.now(), { cache: 'no-store' })]);
      if (a.ok) AUTH.access = await a.json();
      if (d.ok) AUTH.box = await d.json();
    } catch (e) {}
    if (!AUTH.access || !AUTH.box) { showLogin('No se ha podido cargar el cuadrante. Revisa la conexión y recarga la página.'); return; }
    let sess = null;
    try { sess = JSON.parse(localStorage.getItem(KEY + ':sess')); } catch (e) {}
    if (sess && sess.dk && (AUTH.access.users || []).some(x => x.u === sess.u)) {
      try { await openWith(fromB64(sess.dk), sess.u); return; } catch (e) { try { localStorage.removeItem(KEY + ':sess'); } catch (er) {} }
    }
    showLogin();
  }

  async function publishNow() {
    if (WEB) { if (!sync.publishing) return publishWeb(); return; }
    if (!sync.artifact || !PAGE_SOURCE || sync.publishing) { toast('No se puede publicar desde aquí.'); return; }
    sync.publishing = true; render(); setSync('saving', 'Publicando…');
    try { sessionStorage.setItem(KEY + ':week', ymd(ui.week)); } catch (e) {}
    try {
      await sync.artifact.publish(buildPage());
      try { localStorage.removeItem(KEY + ':draft'); } catch (e) {}
      sync.dirty = false; clearTimeout(sync.autoTimer); sync.autoAt = 0;
      setSync('ok', 'Publicado · el equipo ya lo ve');
      toast('Publicado. El equipo verá los cambios al abrir o recargar la app.');
    } catch (e) {
      const code = e && e.code;
      if (code === 'conflict') toast('Había una versión más nueva: se recarga. Tus cambios siguen guardados como borrador.');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'capability_disabled' || code === 'consent_required') { sync.canEdit = false; toast('Desde aquí no se puede publicar: esta vista es solo de consulta.'); }
      else if (code === 'too_large') toast('El cuadrante ocupa demasiado para publicarse. Quita alguna foto y prueba otra vez.');
      else if (code === 'rate_limited') toast('Demasiadas publicaciones seguidas. Espera un minuto y vuelve a publicar.');
      else toast('No se ha podido publicar. Prueba de nuevo en un momento.');
      setSync(sync.canEdit ? 'error' : 'ro', sync.canEdit ? 'Sin publicar' : 'Solo consulta');
    }
    sync.publishing = false; render();
  }
  async function startSync() {
    render();   // primero, modo consulta
    let artifact = null, user = null;
    try { [artifact, user] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]); } catch (e) {}
    let canEdit = false;
    try { canEdit = !!(artifact && user && await user.canEdit()); } catch (e) { canEdit = false; }
    sync.artifact = artifact;
    sync.canEdit = canEdit && !!PAGE_SOURCE;
    if (!sync.canEdit) { setSync('ro', 'Solo consulta'); render(); return; }
    // Recuperar un borrador sin publicar hecho sobre esta misma versión.
    try {
      const d = JSON.parse(localStorage.getItem(KEY + ':draft'));
      if (d && d.S && d.baseRev === (EMB && EMB.rev || null)) { S = d.S; migrate(); sync.dirty = true; scheduleAutoPublish(); }
      else localStorage.removeItem(KEY + ':draft');
    } catch (e) {}
    setSync('ok', sync.dirty ? 'Editando · cambios sin publicar' : 'Puedes editar · el equipo solo consulta');
    render();
  }

  if (SYNC_ON) startSync(); else if (WEB) startWeb(); else render();
  window.addEventListener('beforeunload', e => { if (sync.dirty && !sync.publishing) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(renderNow, 60000);
})();
</script>
